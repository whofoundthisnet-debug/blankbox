<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlankBox Bixel Art</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#171717;
  color:white;
}

#app{
  height:100%;
  display:grid;
  grid-template-rows:58px 1fr 110px;
}

#topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#222;
  border-bottom:2px solid #333;
}

#brand{
  font-size:22px;
  font-weight:900;
}

#actions{
  display:flex;
  gap:8px;
  align-items:center;
}

button,select,input{
  font:inherit;
}

button{
  border:1px solid #444;
  background:#2b2b2b;
  color:white;
  border-radius:7px;
  padding:9px 12px;

}

.primary{

#main{

}

#tools,#panel{

}

#tools{

}

#panel{

}

.section{

}

.tool{

}

.tool.active{

}

#workspace{
  min-width:0;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  overflow:hidden;
}

#canvasWrap{
  position:relative;
  width:min(70vw,70vh);
  height:min(70vw,70vh);
  max-width:700px;
  max-height:700px;
  background:#fff;
  image-rendering:pixelated;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  image-rendering:pixelated;
}

#shadowCanvas{
  pointer-events:none;
}

#pixelCanvas{
  cursor:crosshair;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  color:#aaa;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
}

.field select,
.field input[type="number"],
.field input[type="range"]{
  width:100%;
}

.field select,
.field input[type="number"]{
  padding:8px;
  background:#292929;
  color:white;
  border:1px solid #444;
  border-radius:6px;
}

.colorRow{
  display:flex;
  gap:8px;
  align-items:center;
}

#color{
  width:52px;
  height:38px;
  padding:2px;
}

#hex{
  flex:1;
  min-width:0;
  padding:8px;
  background:#292929;
  color:white;
  border:1px solid #444;
  border-radius:6px;
}

#frames{
  background:#1c1c1c;
  border-top:2px solid #333;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  overflow-x:auto;
}

.frame{
  height:82px;
  min-width:82px;
  background:#111;
  border:2px solid #444;
  border-radius:6px;
  padding:4px;
  cursor:pointer;
}

.frame.active{
  border-color:#72d572;
}

.frame canvas{
  position:static;
  width:70px;
  height:70px;
  display:block;
  background:white;
}

#frameAdd{
  height:82px;
  min-width:82px;
  font-size:28px;
}

.note{
  font-size:12px;
  color:#888;
  line-height:1.4;
}

#analysis{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}

#analysisBox{
  width:min(420px,90vw);
  background:#202020;
  border:2px solid #444;
  border-radius:12px;
  padding:24px;
  text-align:center;
}

#analysisTitle{
  font-size:22px;
  font-weight:900;
  margin-bottom:20px;
}

.analysisStep{
  text-align:left;
  margin:10px 0;
  color:#777;
}

.analysisStep.done{
  color:#72d572;
}

#seedResult{
  margin-top:18px;
  padding:12px;
  background:#111;
  border:1px solid #444;
  border-radius:7px;
  font-family:monospace;
  font-size:12px;
  word-break:break-all;
  max-height:100px;
  overflow:auto;
}

#copySeed{
  margin-top:10px;
  width:100%;
}

</style>
</head>

<body>

<div id="app">

<header id="topbar">
  <div id="brand">BIXEL ART</div>

  <div id="actions">
    <button id="importButton">IMPORT</button>
    <input id="importInput" type="file" accept="image/*" hidden>

    <button id="exportButton">EXPORT PNG</button>

      DONE
    </button>
  </div>
</header>


<div id="main">

<aside id="tools">

<div class="section">Tools</div>

<button class="tool active" data-tool="pencil">
✏ Pencil
</button>

<button class="tool" data-tool="eraser">

</button>

<button class="tool" data-tool="fill">
▧ Fill
</button>

<button class="tool" data-tool="picker">
◉ Color Picker
</button>


<div class="section" style="margin-top:20px">
Canvas
</div>

<div class="field">

<select id="canvasSize">

id="color"

id="hex"

Shadow
</div>

<option value="none">None</option>

id="fps"

▶ PREVIEW

<!-- ANALYSIS SCREEN -->

<div id="analysis">

ANALYZING BIXEL...
</div>

○ Reading pixels
</div>

<div class="analysisStep" id="step2">
○ Checking center
</div>

<div class="analysisStep" id="step3">
○ Checking X / Y axes
</div>

<div class="analysisStep" id="step4">
○ Building shape data
</div>

<div class="analysisStep" id="step5">
○ Encoding colors
</div>

○ Generating seed
</div>

<div id="seedResult">
</div>

<button id="copySeed">
COPY BBX CODE
</button>

<script>

const pixelCanvas =
document.getElementById("pixelCanvas");

const shadowCanvas =
document.getElementById("shadowCanvas");

const wrap =
document.getElementById("canvasWrap");

const ctx =
pixelCanvas.getContext("2d");

const sctx =
shadowCanvas.getContext("2d");


let size = 32;

let tool = "pencil";

let color = "#111111";

let drawing = false;

let frames = [];

let currentFrame = 0;

let shadowPose = "none";

let shadowOpacity = 0.30;

let previewing = false;

let previewTimer = null;


/* =========================
   FRAME SYSTEM
========================= */

function makeFrame(){

  const c =
  document.createElement("canvas");

  c.width = size;
  c.height = size;

  return c;

}


function resetFrames(){

  frames = [makeFrame()];

  currentFrame = 0;

  renderCurrent();

  renderFrames();

}


/* =========================
   RENDER
========================= */

function renderCurrent(){

  pixelCanvas.width = size;
  pixelCanvas.height = size;

  shadowCanvas.width = size;
  shadowCanvas.height = size;

  ctx.clearRect(
    0,
    0,
    size,
    size
  );

  ctx.drawImage(
    frames[currentFrame],
    0,
    0
  );

  drawGrid();

  drawShadow();

}


function drawGrid(){

  ctx.save();

  ctx.strokeStyle =
  "rgba(0,0,0,.13)";

  ctx.lineWidth =
  1 / size;

  for(let i=1;i<size;i++){

    ctx.beginPath();

    ctx.moveTo(i,0);
    ctx.lineTo(i,size);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(0,i);
    ctx.lineTo(size,i);

    ctx.stroke();

  }

  ctx.restore();

}


/* =========================
   SHADOW
========================= */

function shadowLine(
  x1,y1,x2,y2
){

  sctx.beginPath();

  sctx.moveTo(x1,y1);
  sctx.lineTo(x2,y2);

  sctx.stroke();

}


function drawShadow(){

  sctx.clearRect(
    0,
    0,
    size,
    size
  );

  if(shadowPose === "none")
    return;

  sctx.save();

  sctx.globalAlpha =
  shadowOpacity;

  sctx.strokeStyle =
  "#4a7cff";

  sctx.fillStyle =
  "#4a7cff";

  sctx.lineWidth =
  Math.max(1,size/18);

  sctx.lineCap =
  "round";

  const cx =
  size/2;

  const head =
  size*0.27;

  let bodyY =
  size*0.52;

  let lean = 0;

  let leftLeg =
  size*0.72;

  let rightLeg =
  size*0.72;

  let armY =
  size*0.54;

  if(shadowPose==="walk"){

    lean=-2;

    leftLeg=size*0.82;

    rightLeg=size*0.68;

  }

  if(shadowPose==="run"){

    lean=-4;

    leftLeg=size*0.82;

    rightLeg=size*0.65;

  }

  if(shadowPose==="jump"){

    bodyY=size*0.46;

    leftLeg=size*0.68;

    rightLeg=size*0.68;

  }

  if(shadowPose==="hit"){

    lean=4;

    armY=size*0.48;

  }


  sctx.beginPath();

  sctx.arc(
    cx+lean,
    head,
    size*0.10,
    0,
    Math.PI*2
  );

  sctx.fill();


  shadowLine(
    cx+lean,
    head+size*0.10,
    cx+lean,
    bodyY
  );

  shadowLine(
    cx+lean,
    armY,
    cx-size*0.18+lean,
    armY+size*0.08
  );

  shadowLine(
    cx+lean,
    armY,
    cx+size*0.18+lean,
    armY+size*0.08
  );

  shadowLine(
    cx+lean,
    bodyY,
    cx-size*0.10+lean,
    leftLeg
  );

  shadowLine(
    cx+lean,
    bodyY,
    cx+size*0.10+lean,
    rightLeg
  );

  sctx.restore();

}


/* =========================
   DRAWING
========================= */

function setPixel(px,py){

  if(
    px<0 ||
    py<0 ||
    px>=size ||
    py>=size
  ) return;


  const fctx =
  frames[currentFrame]
  .getContext("2d");


  if(tool==="picker"){

    const data =
    fctx.getImageData(
      px,
      py,
      1,
      1
    ).data;

    if(data[3]===0)
      return;

    const hex =
      "#" +
      [data[0],data[1],data[2]]
      .map(v =>
        v.toString(16)
        .padStart(2,"0")
      )
      .join("");

    color = hex;

    document
      .getElementById("color")
      .value = hex;

    document
      .getElementById("hex")
      .value = hex;

    tool="pencil";

    document
      .querySelectorAll(".tool")
      .forEach(b =>
        b.classList.toggle(
          "active",
          b.dataset.tool==="pencil"
        )
      );

    return;

  }


  if(tool==="eraser"){

    fctx.clearRect(
      px,
      py,
      1,
      1
    );

  }else{

    fctx.fillStyle =
    quantizeColor(color);

    fctx.fillRect(
      px,
      py,
      1,
      1
    );

  }

  renderCurrent();

}


/* =========================
   COLOR QUANTIZATION
========================= */

function quantizeChannel(value){

  return Math.min(
    250,
    Math.round(
      Number(value)/10
    )*10
  );

}


function quantizeColor(hex){

  if(!/^#[0-9a-fA-F]{6}$/.test(hex))
    return "#000000";

  const r =
    parseInt(hex.slice(1,3),16);

  const g =
    parseInt(hex.slice(3,5),16);

  const b =
    parseInt(hex.slice(5,7),16);

  const qr =
    quantizeChannel(r);

  const qg =
    quantizeChannel(g);

  const qb =
    quantizeChannel(b);

  return "#" +
    [qr,qg,qb]
    .map(v =>
      v.toString(16)
      .padStart(2,"0")
    )
    .join("");

}


/* =========================
   FILL
========================= */

function fill(){

  const fctx =
  frames[currentFrame]
  .getContext("2d");

  fctx.fillStyle =
  quantizeColor(color);

  fctx.fillRect(
    0,
    0,
    size,
    size
  );

  renderCurrent();

}


/* =========================
   MOUSE POSITION
========================= */

function canvasPoint(event){

  const rect =
  pixelCanvas
  .getBoundingClientRect();

  return {

    x:Math.floor(
      (event.clientX-rect.left) /
      rect.width *
      size
    ),

    y:Math.floor(
      (event.clientY-rect.top) /
      rect.height *
      size
    )

  };

}


pixelCanvas.addEventListener(
  "pointerdown",
  e => {

    drawing=true;

    pixelCanvas.setPointerCapture(
      e.pointerId
    );

    const p =
    canvasPoint(e);

    if(tool==="fill")
      fill();
    else
      setPixel(p.x,p.y);

  }
);


pixelCanvas.addEventListener(
  "pointermove",
  e => {

    if(!drawing ||
       tool==="fill")
      return;

    const p =
    canvasPoint(e);

    setPixel(
      p.x,
      p.y
    );

  }
);


pixelCanvas.addEventListener(
  "pointerup",
  () => drawing=false
);


pixelCanvas.addEventListener(
  "pointercancel",
  () => drawing=false
);


/* =========================
   TOOLS
========================= */

document
.querySelectorAll(".tool")
.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      tool =
      button.dataset.tool;

      document
      .querySelectorAll(".tool")
      .forEach(b =>
        b.classList.toggle(
          "active",
          b===button
        )
      );

    }
  );

});


/* =========================
   COLORS
========================= */

document
.getElementById("color")
.addEventListener(
  "input",
  e => {

    color =
    quantizeColor(e.target.value);

    document
    .getElementById("color")
    .value=color;

    document
    .getElementById("hex")
    .value=color;

  }
);


document
.getElementById("hex")
.addEventListener(
  "input",
  e => {

    if(/^#[0-9a-fA-F]{6}$/
      .test(e.target.value)){

      color =
      quantizeColor(
        e.target.value
      );

      document
      .getElementById("color")
      .value=color;

    }

  }
);


/* =========================
   CANVAS SIZE
========================= */

document
.getElementById("canvasSize")
.addEventListener(
  "change",
  e => {

    size =
    Number(e.target.value);

    resetFrames();

  }
);


document
.getElementById("newButton")
.addEventListener(
  "click",
  resetFrames
);


/* =========================
   SHADOW
========================= */

document
.getElementById("shadowPose")
.addEventListener(
  "change",
  e => {

    shadowPose =
    e.target.value;

    renderCurrent();

  }
);


document
.getElementById("shadowOpacity")
.addEventListener(
  "input",
  e => {

    shadowOpacity =
    Number(e.target.value)/100;

    document
    .getElementById("sizeText")
    .textContent =
    e.target.value+"%";

    renderCurrent();

  }
);


/* =========================
   FRAMES
========================= */

function renderFrames(){

  document
  .querySelectorAll(".frame")
  .forEach(e => e.remove());

  const add =
  document.getElementById("frameAdd");


  frames.forEach(
    (frame,index) => {

      const button =
      document.createElement("button");

      button.className =
      "frame" +
      (
        index===currentFrame
        ? " active"
        : ""
      );

      button.type="button";


      const preview =
      document.createElement("canvas");

      preview.width=size;
      preview.height=size;

      preview
      .getContext("2d")
      .drawImage(frame,0,0);


      button.appendChild(preview);

      button.title =
      "Frame "+(index+1);


      button.addEventListener(
        "click",
        () => {

          currentFrame=index;

          renderCurrent();

          renderFrames();

        }
      );


      document
      .getElementById("frames")
      .insertBefore(
        button,
        add
      );

    }
  );

}


document
.getElementById("frameAdd")
.addEventListener(
  "click",
  () => {

    const next =
    makeFrame();

    next
    .getContext("2d")
    .drawImage(
      frames[currentFrame],
      0,
      0
    );

    frames.push(next);

    currentFrame =
    frames.length-1;

    renderCurrent();

    renderFrames();

  }
);


/* =========================
   IMPORT
========================= */

document
.getElementById("importButton")
.addEventListener(
  "click",
  () => {

    document
    .getElementById("importInput")
    .click();

  }
);


document
.getElementById("importInput")
.addEventListener(
  "change",
  e => {

    const file =
    e.target.files[0];

    if(!file) return;


    const img =
    new Image();


    img.onload=()=>{

      const frame =
      makeFrame();

      const fctx =
      frame.getContext("2d");

      fctx.clearRect(
        0,0,size,size
      );

      fctx.imageSmoothingEnabled=false;


      const scale =
      Math.min(
        size/img.width,
        size/img.height
      );


      const w =
      Math.max(
        1,
        Math.round(img.width*scale)
      );

      const h =
      Math.max(
        1,
        Math.round(img.height*scale)
      );


      const x =
      Math.floor((size-w)/2);

      const y =
      Math.floor((size-h)/2);


      fctx.drawImage(
        img,
        x,
        y,
        w,
        h
      );


      frames[currentFrame]=frame;

      renderCurrent();

      renderFrames();

      URL.revokeObjectURL(
        img.src
      );

    };


    img.src =
    URL.createObjectURL(file);

  }
);


/* =========================
   EXPORT
========================= */

document
.getElementById("exportButton")
.addEventListener(
  "click",
  () => {

    const out =
    document.createElement("canvas");

    out.width=size;
    out.height=size;

    out
    .getContext("2d")
    .drawImage(
      frames[currentFrame],
      0,
      0
    );


    const a =
    document.createElement("a");

    a.download =
    "bixel-sprite.png";

    a.href =
    out.toDataURL("image/png");

    a.click();

  }
);


/* ==================================================
   BIXEL SEED SYSTEM
================================================== */


/*
  We are NOT brute-forcing every possible picture.

  Instead we encode the exact pixels.

  BBX1 format:

  BBX1|size|pixelData

  Each pixel is represented by:

  0 = transparent

  Otherwise:
  RGB values are quantized to steps of 10.

  Each color becomes:

  R,G,B

  Example:

  120,40,200

*/


function encodeFrame(frame){

  const fctx =
  frame.getContext("2d");

  const image =
  fctx.getImageData(
    0,
    0,
    size,
    size
  ).data;


  let result=[];


  for(
    let i=0;
    i<image.length;
    i+=4
  ){

    const r=image[i];

    const g=image[i+1];

    const b=image[i+2];

    const a=image[i+3];


    if(a===0){

      result.push("0");

    }else{

      const qr =
      quantizeChannel(r);

      const qg =
      quantizeChannel(g);

      const qb =
      quantizeChannel(b);

      result.push(
        qr+","+qg+","+qb
      );

    }

  }


  return result.join(";");

}


function generateBBXCode(){

  const encodedFrames =
  frames.map(
    frame => encodeFrame(frame)
  );


  const fps =
  Math.max(
    1,
    Math.min(
      60,
      Number(
        document
        .getElementById("fps")
        .value
      ) || 8
    )
  );


  return (
    "BBX1|" +
    size +
    "|" +
    fps +
    "|" +
    encodedFrames.join("||")
  );

}


/* =========================
   ANALYSIS
========================= */

function setStep(
  number,
  text
){

  const step =
  document.getElementById(
    "step"+number
  );

  step.textContent =
  "✓ "+text;

  step.classList.add("done");

}


function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(resolve,ms)
  );

}


async function analyzeAndFinish(){

  document
  .getElementById("analysis")
  .style.display="flex";


  for(let i=1;i<=6;i++){

    document
    .getElementById("step"+i)
    .classList.remove("done");

  }


  document
  .getElementById("seedResult")
  .textContent="";


  await wait(150);

  setStep(
    1,
    "Reading pixels"
  );


  await wait(120);

  setStep(
    2,
    "Checking center"
  );


  await wait(120);

  setStep(
    3,
    "Checking X / Y axes"
  );


  await wait(120);

  setStep(
    4,
    "Building shape data"
  );


  await wait(120);

  setStep(
    5,
    "Encoding colors"
  );


  await wait(120);


  const code =
  generateBBXCode();


  setStep(
    6,
    "Generating seed"
  );


  document
  .getElementById("seedResult")
  .textContent=code;


  /*
    Save it so engine.html can retrieve it.
  */

  localStorage.setItem(
    "blankbox_bixel_code",
    code
  );

}


/* =========================
   COPY CODE
========================= */

document
.getElementById("copySeed")
.addEventListener(
  "click",
  async () => {

    const code =
    document
    .getElementById("seedResult")
    .textContent;

    if(!code)
      return;

    await navigator
      .clipboard
      .writeText(code);

    document
    .getElementById("copySeed")
    .textContent =
    "COPIED ✓";


    setTimeout(
      () => {

        document
        .getElementById("copySeed")
        .textContent =
        "COPY BBX CODE";

      },
      1200
    );

  }
);


/* =========================
   DONE
========================= */

document
.getElementById("doneButton")
.addEventListener(
  "click",
  async () => {

    await analyzeAndFinish();

    /*
      Wait a moment so the user
      can actually see the analysis.
    */

    await wait(900);

    window.location.href =
      "engine.html";

  }
);


/* =========================
   PREVIEW
========================= */

document
.getElementById("previewButton")
.addEventListener(
  "click",
  () => {

    if(frames.length<2)
      return;


    previewing =
    !previewing;


    document
    .getElementById("previewButton")
    .textContent =
    previewing
    ? "■ STOP"
    : "▶ PREVIEW";


    if(previewing){

      let i=currentFrame;


      const tick=()=>{

        if(!previewing)
          return;


        currentFrame =
        i % frames.length;


        renderCurrent();

        renderFrames();

        i++;


        const fps =
        Math.max(
          1,
          Math.min(
            60,
            Number(
              document
              .getElementById("fps")
              .value
            ) || 8
          )
        );


        previewTimer =
        setTimeout(
          tick,
          1000/fps
        );

      };


      tick();


    }else{

      clearTimeout(
        previewTimer
      );

    }

  }
);


/* =========================
   START
========================= */

resetFrames();

</script>
