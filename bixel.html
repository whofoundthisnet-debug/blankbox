<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlankBox Bixel Art</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#171717;
  color:white;
}

#app{
  height:100%;
  display:grid;
  grid-template-rows:58px 1fr 110px;
}

#topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#222;
  border-bottom:2px solid #333;
}

#brand{
  font-size:22px;
  font-weight:900;
}

#actions{
  display:flex;
  gap:8px;
  align-items:center;
}

button,select,input{
  font:inherit;
}

button{
  border:1px solid #444;
  background:#2b2b2b;
  color:white;
  border-radius:7px;
  padding:9px 12px;
  cursor:pointer;
}

button:hover{
  background:#363636;
}

.primary{
  background:#72d572;
  color:#111;
  border-color:#72d572;
  font-weight:900;
}

#main{
  min-height:0;
  display:grid;
  grid-template-columns:180px 1fr 230px;
}

#tools,#panel{
  background:#202020;
  padding:14px;
  overflow:auto;
}

#tools{
  border-right:2px solid #333;
}

#panel{
  border-left:2px solid #333;
}

.section{
  font-size:12px;
  color:#aaa;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
  margin:4px 0 10px;
}

.tool{
  display:block;
  width:100%;
  margin-bottom:8px;
  text-align:left;
}

.tool.active{
  outline:2px solid #72d572;
}

#workspace{
  min-width:0;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  overflow:hidden;
}

#canvasWrap{
  position:relative;
  width:min(70vw,70vh);
  height:min(70vw,70vh);
  max-width:700px;
  max-height:700px;
  background:#fff;
  image-rendering:pixelated;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  image-rendering:pixelated;
}

#shadowCanvas{
  pointer-events:none;
}

#pixelCanvas{
  cursor:crosshair;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  color:#aaa;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
}

.field select,
.field input[type="number"],
.field input[type="range"]{
  width:100%;
}

.field select,
.field input[type="number"]{
  padding:8px;
  background:#292929;
  color:white;
  border:1px solid #444;
  border-radius:6px;
}

.colorRow{
  display:flex;
  gap:8px;
  align-items:center;
}

#color{
  width:52px;
  height:38px;
  padding:2px;
}

#hex{
  flex:1;
  min-width:0;
  padding:8px;
  background:#292929;
  color:white;
  border:1px solid #444;
  border-radius:6px;
}

#frames{
  background:#1c1c1c;
  border-top:2px solid #333;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  overflow-x:auto;
}

.frame{
  height:82px;
  min-width:82px;
  background:#111;
  border:2px solid #444;
  border-radius:6px;
  padding:4px;
  cursor:pointer;
}

.frame.active{
  border-color:#72d572;
}

.frame canvas{
  position:static;
  width:70px;
  height:70px;
  display:block;
  background:white;
}

#frameAdd{
  height:82px;
  min-width:82px;
  font-size:28px;
}

.note{
  font-size:12px;
  color:#888;
  line-height:1.4;
}

#analysis{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}

#analysisBox{
  width:min(420px,90vw);
  background:#202020;
  border:2px solid #444;
  border-radius:12px;
  padding:24px;
  text-align:center;
}

#analysisTitle{
  font-size:22px;
  font-weight:900;
  margin-bottom:20px;
}

.analysisStep{
  text-align:left;
  margin:10px 0;
  color:#777;
}

.analysisStep.done{
  color:#72d572;
}

#seedResult{
  margin-top:18px;
  padding:12px;
  background:#111;
  border:1px solid #444;
  border-radius:7px;
  font-family:monospace;
  font-size:12px;
  word-break:break-all;
  max-height:100px;
  overflow:auto;
}

#copySeed{
  margin-top:10px;
  width:100%;
}

</style>
</head>

<body>
<div id="animationControls">

  <div id="frameCounter">
    1 / 1
  </div>

  <button id="addFrame">
    + FRAME
  </button>

  <button id="deleteFrame">
    DELETE FRAME
  </button>

  <label>
    FPS
    <input
      id="fps"
      type="number"
      min="1"
      max="60"
      value="8"
    >
  </label>

</div>

<div id="frames"></div>
<div id="app">

<header id="topbar">
  <div id="brand">BIXEL ART</div>

  <div id="actions">
    <button id="importButton">IMPORT</button>
    <input id="importInput" type="file" accept="image/*" hidden>

    <button id="exportButton">EXPORT PNG</button>

    <button class="primary" id="doneButton">
      DONE
    </button>
  </div>
</header>


<div id="main">

<aside id="tools">

<div class="section">Tools</div>

<button class="tool active" data-tool="pencil">
✏ Pencil
</button>

<button class="tool" data-tool="eraser">
⌫ Eraser
</button>

<button class="tool" data-tool="fill">
▧ Fill
</button>

<button class="tool" data-tool="picker">
◉ Color Picker
</button>


<div class="section" style="margin-top:20px">
Canvas
</div>

<div class="field">

<label>Size</label>

<select id="canvasSize">
<option value="16">16 × 16</option>
<option value="24">24 × 24</option>
<option value="32" selected>32 × 32</option>
<option value="48">48 × 48</option>
<option value="64">64 × 64</option>
</select>

</div>

<button id="newButton">
NEW SPRITE
</button>

</aside>


<section id="workspace">

<div id="canvasWrap">

<canvas id="shadowCanvas"></canvas>

<canvas id="pixelCanvas"></canvas>

</div>

</section>


<aside id="panel">

<div class="section">
Color
</div>

<div class="field">

<div class="colorRow">

<input
id="color"
type="color"
value="#111111">

<input
id="hex"
value="#111111"
maxlength="7">

</div>

</div>


<div class="section">
Shadow
</div>

<div class="field">

<label>Template</label>

<select id="shadowPose">

<option value="none">None</option>
<option value="idle">Idle</option>
<option value="walk">Walk</option>
<option value="run">Run</option>
<option value="jump">Jump</option>
<option value="hit">Hit</option>

</select>

</div>


<div class="field">

<label>
Opacity
<span id="sizeText">30%</span>
</label>

<input
id="shadowOpacity"
type="range"
min="5"
max="70"
value="30">

</div>


<div class="section">
Animation
</div>

<div class="field">

<label>Frame speed</label>

<input
id="fps"
type="number"
min="1"
max="60"
value="8">

</div>

<button id="previewButton">
▶ PREVIEW
</button>

</aside>

</div>


<div id="frames">

<button id="frameAdd">+</button>

</div>

</div>


<!-- ANALYSIS SCREEN -->

<div id="analysis">

<div id="analysisBox">

<div id="analysisTitle">
ANALYZING BIXEL...
</div>

<div class="analysisStep" id="step1">
○ Reading pixels
</div>

<div class="analysisStep" id="step2">
○ Checking center
</div>

<div class="analysisStep" id="step3">
○ Checking X / Y axes
</div>

<div class="analysisStep" id="step4">
○ Building shape data
</div>

<div class="analysisStep" id="step5">
○ Encoding colors
</div>

<div class="analysisStep" id="step6">
○ Generating seed
</div>

<div id="seedResult">
</div>

<button id="copySeed">
COPY BBX CODE
</button>

</div>

</div>


<script>

/* =========================================================
   BIXEL
   ========================================================= */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;


/* =========================================================
   SETTINGS
   ========================================================= */

let canvasSize = 16;

let fps = 8;

const MAX_FRAMES = 16;


/* =========================================================
   FRAMES
   ========================================================= */

let frames = [];

let currentFrame = 0;


/*
  Each frame stores:

  {
    pixels: [...],
    shadow: [...]
  }
*/


function createBlankFrame() {

  return {

    pixels:
      new Array(
        canvasSize * canvasSize
      ).fill(null),

    shadow: null

  };

}


/* =========================================================
   CREATE FIRST FRAME
   ========================================================= */

function initializeFrames() {

  frames = [
    createBlankFrame()
  ];

  currentFrame = 0;

  renderFrameList();

  loadCurrentFrame();

}


/* =========================================================
   FRAME PIXEL INDEX
   ========================================================= */

function pixelIndex(x, y) {

  return (
    y * canvasSize +
    x
  );

}


/* =========================================================
   DRAW FRAME TO CANVAS
   ========================================================= */

function loadCurrentFrame() {

  const frame =
    frames[currentFrame];

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const pixelSize =
    canvas.width /
    canvasSize;


  for (
    let y = 0;
    y < canvasSize;
    y++
  ) {

    for (
      let x = 0;
      x < canvasSize;
      x++
    ) {

      const color =
        frame.pixels[
          pixelIndex(x, y)
        ];


      if (!color)
        continue;


      ctx.fillStyle =
        color;


      ctx.fillRect(
        x * pixelSize,
        y * pixelSize,
        pixelSize,
        pixelSize
      );

    }

  }

}


/* =========================================================
   FRAME THUMBNAILS
   ========================================================= */

function renderFrameList() {

  const frameList =
    document.getElementById(
      "frames"
    );


  if (!frameList)
    return;


  frameList.innerHTML = "";


  frames.forEach(
    (frame, index) => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "frameButton";


      if (
        index === currentFrame
      ) {

        button.classList.add(
          "active"
        );

      }


      button.textContent =
        index + 1;


      button.addEventListener(
        "click",
        () => {

          saveCurrentFrame();

          currentFrame =
            index;

          loadCurrentFrame();

          renderFrameList();

        }
      );


      frameList.appendChild(
        button
      );

    }
  );


  /*
    Update frame counter
  */

  const counter =
    document.getElementById(
      "frameCounter"
    );


  if (counter) {

    counter.textContent =
      `${currentFrame + 1} / ${frames.length}`;

  }

}


/* =========================================================
   SAVE CURRENT FRAME
   ========================================================= */

function saveCurrentFrame() {

  const frame =
    frames[currentFrame];


  if (!frame)
    return;


  /*
    Read the canvas pixel-by-pixel.
  */

  const image =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const pixelSize =
    canvas.width /
    canvasSize;


  for (
    let y = 0;
    y < canvasSize;
    y++
  ) {

    for (
      let x = 0;
      x < canvasSize;
      x++
    ) {

      const sampleX =
        Math.floor(
          x * pixelSize +
          pixelSize / 2
        );


      const sampleY =
        Math.floor(
          y * pixelSize +
          pixelSize / 2
        );


      const index =
        (
          sampleY *
          canvas.width +
          sampleX
        ) * 4;


      const r =
        image.data[index];

      const g =
        image.data[index + 1];

      const b =
        image.data[index + 2];

      const a =
        image.data[index + 3];


      if (a === 0) {

        frame.pixels[
          pixelIndex(x, y)
        ] = null;

      }

      else {

        frame.pixels[
          pixelIndex(x, y)
        ] =
          `rgb(${r},${g},${b})`;

      }

    }

  }

}


/* =========================================================
   ADD FRAME
   ========================================================= */

function addFrame() {

  if (
    frames.length >=
    MAX_FRAMES
  ) {

    alert(
      "Bixel animations can have a maximum of 16 frames."
    );

    return;

  }


  saveCurrentFrame();


  const newFrame =
    createBlankFrame();


  /*
    New frame is inserted
    AFTER the current frame.
  */

  frames.splice(
    currentFrame + 1,
    0,
    newFrame
  );


  currentFrame++;


  loadCurrentFrame();

  renderFrameList();

}


/* =========================================================
   DELETE FRAME
   ========================================================= */

function deleteFrame() {

  if (
    frames.length <= 1
  ) {

    alert(
      "You need at least one frame."
    );

    return;

  }


  frames.splice(
    currentFrame,
    1
  );


  if (
    currentFrame >=
    frames.length
  ) {

    currentFrame =
      frames.length - 1;

  }


  loadCurrentFrame();

  renderFrameList();

}


/* =========================================================
   CANVAS SIZE
   ========================================================= */

function setCanvasSize(size) {

  saveCurrentFrame();


  canvasSize =
    Number(size);


  canvas.width =
    canvasSize * 20;

  canvas.height =
    canvasSize * 20;


  frames = [
    createBlankFrame()
  ];

  currentFrame = 0;


  loadCurrentFrame();

  renderFrameList();

}


/* =========================================================
   FPS
   ========================================================= */

const fpsInput =
  document.getElementById(
    "fps"
  );


if (fpsInput) {

  fpsInput.addEventListener(
    "input",
    () => {

      fps =
        Math.max(
          1,
          Math.min(
            60,
            Number(
              fpsInput.value
            ) || 8
          )
        );

    }
  );

}


/* =========================================================
   TOOLS
   ========================================================= */

let currentTool =
  "pencil";

let currentColor =
  "#ffffff";


function paintPixel(x, y) {

  if (
    x < 0 ||
    y < 0 ||
    x >= canvasSize ||
    y >= canvasSize
  )
    return;


  const frame =
    frames[currentFrame];


  const index =
    pixelIndex(x, y);


  if (
    currentTool ===
    "eraser"
  ) {

    frame.pixels[index] =
      null;

  }

  else {

    frame.pixels[index] =
      currentColor;

  }


  loadCurrentFrame();

}


/* =========================================================
   CANVAS MOUSE
   ========================================================= */

let drawing = false;


function getPixelFromMouse(event) {

  const rect =
    canvas.getBoundingClientRect();


  const x =
    Math.floor(
      (
        event.clientX -
        rect.left
      ) /
      rect.width *
      canvasSize
    );


  const y =
    Math.floor(
      (
        event.clientY -
        rect.top
      ) /
      rect.height *
      canvasSize
    );


  return {
    x,
    y
  };

}


canvas.addEventListener(
  "pointerdown",
  event => {

    drawing = true;

    canvas.setPointerCapture(
      event.pointerId
    );


    const {
      x,
      y
    } =
      getPixelFromMouse(event);


    paintPixel(x, y);

  }
);


canvas.addEventListener(
  "pointermove",
  event => {

    if (!drawing)
      return;


    const {
      x,
      y
    } =
      getPixelFromMouse(event);


    paintPixel(x, y);

  }
);


canvas.addEventListener(
  "pointerup",
  () => {

    drawing = false;

  }
);


canvas.addEventListener(
  "pointercancel",
  () => {

    drawing = false;

  }
);


/* =========================================================
   COLOR INPUT
   ========================================================= */

const colorInput =
  document.getElementById(
    "color"
  );


if (colorInput) {

  colorInput.addEventListener(
    "input",
    () => {

      currentColor =
        colorInput.value;

      currentTool =
        "pencil";

    }
  );

}


/* =========================================================
   TOOL BUTTONS
   ========================================================= */

const pencilButton =
  document.getElementById(
    "pencil"
  );


const eraserButton =
  document.getElementById(
    "eraser"
  );


if (pencilButton) {

  pencilButton.addEventListener(
    "click",
    () => {

      currentTool =
        "pencil";

    }
  );

}


if (eraserButton) {

  eraserButton.addEventListener(
    "click",
    () => {

      currentTool =
        "eraser";

    }
  );

}


/* =========================================================
   BBX ENCODING
   ========================================================= */

function colorToBBX(color) {

  if (!color)
    return "0";


  /*
    rgb(r,g,b)
  */

  const match =
    color.match(
      /rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)/
    );


  if (!match)
    return "0";


  let r =
    Number(match[1]);

  let g =
    Number(match[2]);

  let b =
    Number(match[3]);


  /*
    Quantize to nearest 10.
  */

  r =
    Math.min(
      250,
      Math.round(r / 10) * 10
    );

  g =
    Math.min(
      250,
      Math.round(g / 10) * 10
    );

  b =
    Math.min(
      250,
      Math.round(b / 10) * 10
    );


  return `${r},${g},${b}`;

}


/* =========================================================
   MAKE BBX
   ========================================================= */

function createBBX() {

  saveCurrentFrame();


  const encodedFrames =
    frames.map(
      frame => {

        return frame.pixels
          .map(
            color =>
              colorToBBX(
                color
              )
          )
          .join(";");

      }
    );


  return (
    "BBX1|" +
    canvasSize +
    "|" +
    fps +
    "|" +
    encodedFrames.join(
      "||"
    )
  );

}


/* =========================================================
   DONE
   ========================================================= */

const doneButton =
  document.getElementById(
    "done"
  );


if (doneButton) {

  doneButton.addEventListener(
    "click",
    () => {

      saveCurrentFrame();


      const code =
        createBBX();


      /*
        Save the animation.
      */

      localStorage.setItem(
        "blankbox_bixel_code",
        code
      );


      /*
        Make sure target object
        remains intact.
      */

      /*
        Go back to Blank Box.
      */

      window.location.href =
        "engine.html";

    }
  );

}


/* =========================================================
   ADD FRAME BUTTON
   ========================================================= */

const addFrameButton =
  document.getElementById(
    "addFrame"
  );


if (addFrameButton) {

  addFrameButton.addEventListener(
    "click",
    addFrame
  );

}


/* =========================================================
   DELETE FRAME BUTTON
   ========================================================= */

const deleteFrameButton =
  document.getElementById(
    "deleteFrame"
  );


if (deleteFrameButton) {

  deleteFrameButton.addEventListener(
    "click",
    deleteFrame
  );

}


/* =========================================================
   INITIALIZE
   ========================================================= */

initializeFrames();

</script>
</body>
</html>
