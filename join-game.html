<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Join Blank Box Game</title>

<style>
  body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
  }

  .box {
    width: min(90%, 420px);
    background: #1c1c1c;
    padding: 30px;
    border-radius: 12px;
    border: 1px solid #444;
  }

  h1 {
    margin-top: 0;
  }

  input {
    width: 100%;
    padding: 14px;
    font-size: 20px;
    box-sizing: border-box;
    margin-bottom: 12px;

    background: #111;
    color: white;
    border: 1px solid #555;
    border-radius: 7px;

    text-transform: uppercase;
    letter-spacing: 3px;
  }

  button {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    cursor: pointer;
    border: 0;
    border-radius: 7px;
  }
</style>
</head>

<body>

<div class="box">

  <h1>JOIN GAME</h1>

  <p>Enter the game code from the creator.</p>

  <input
    id="codeInput"
    maxlength="6"
    placeholder="ABC123"
  >

  <button id="joinButton">
    JOIN
  </button>

</div>

<script>

const codeInput =
  document.getElementById("codeInput");

const joinButton =
  document.getElementById("joinButton");

joinButton.addEventListener("click", () => {

  const code =
    codeInput.value
      .trim()
      .toUpperCase();

  if (code.length !== 6) {

    alert("Enter the 6-character game code.");

    return;
  }

  window.location.href =
    `engine.html?join=${encodeURIComponent(code)}`;

});

</script>

</body>
</html>
