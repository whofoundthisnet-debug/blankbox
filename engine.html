<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlankBox Engine</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #171717;
      color: white;
    }

    #engine {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 220px 1fr 280px;
      grid-template-rows: 60px 1fr;
    }

    /* =========================================================
       TOP BAR
       ========================================================= */

    #topbar {
      grid-column: 1 / 4;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      background: #222;
      border-bottom: 2px solid #333;
    }

    #logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
    }

   #topButtons {
    display: flex;
    align-items: center;
    gap: 8px;
}

    #playButton,
    #stopButton {
      padding: 10px 28px;

      border: 0;
      border-radius: 8px;

      font-size: 16px;
      font-weight: 900;

      cursor: pointer;
    }

    #playButton {
      background: #72d572;
      color: #111;
    }

    #stopButton {
      display: none;

      background: #e85b5b;
      color: white;
    }
     #backButton {
       background: #292929;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
  }

#backButton:hover {
    background: #3a3a3a;
}
    #playButton:hover,
    #stopButton:hover {
      filter: brightness(1.08);
    }

    /* =========================================================
       SIDEBAR
       ========================================================= */

    #sidebar {
      background: #202020;
      border-right: 2px solid #333;

      padding: 16px;

      overflow-y: auto;
    }

    .panelTitle {
      margin-bottom: 14px;

      font-size: 13px;
      font-weight: 900;

      color: #aaa;

      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .objectButton {
      width: 100%;

      margin-bottom: 8px;
      padding: 12px;

      border: 1px solid #3a3a3a;
      border-radius: 7px;

      background: #292929;
      color: white;

      text-align: left;
      font-weight: 700;

      cursor: pointer;
    }

    .objectButton:hover {
      background: #333;
    }

    /* =========================================================
       WORKSPACE
       ========================================================= */

    #workspace {
      position: relative;
      overflow: hidden;

      background:
        linear-gradient(#242424 1px, transparent 1px),
        linear-gradient(90deg, #242424 1px, transparent 1px);

      background-size: 32px 32px;
    }

    #workspaceHint {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      color: #555;

      font-size: 22px;
      font-weight: 900;

      pointer-events: none;
      user-select: none;
    }

    /* =========================================================
       PROPERTIES
       ========================================================= */

    #properties {
      background: #202020;
      border-left: 2px solid #333;

      padding: 16px;

      overflow-y: auto;
    }

    #selectedObject {
      margin-bottom: 20px;

      font-size: 20px;
      font-weight: 900;
    }

    .property {
      margin-bottom: 14px;
    }

    .property label {
      display: block;

      margin-bottom: 6px;

      color: #aaa;

      font-size: 13px;
      font-weight: 700;
    }

    .property input,
    .property select {
      width: 100%;

      padding: 9px;

      border: 1px solid #444;
      border-radius: 6px;

      background: #292929;
      color: white;

      font-size: 14px;
    }

    #emptyProperties {
      color: #777;
      line-height: 1.5;
    }

    /* =========================================================
       OBJECTS
       ========================================================= */

      .gameObject {
      touch-action: none;

      position: absolute;

      width: 80px;
      height: 80px;

      border: 3px solid white;
      border-radius: 8px;

      cursor: pointer;
      user-select: none;

      overflow: hidden;
    }

    .player {
      background: #5b8cff;
    }

    .enemy {
      background: #e85b5b;
    }

    .platform {
      background: #9a9a9a;
      border-radius: 4px;
    }

    .weapon {
      background: #d69b52;
    }

    .npc {
      background: #a36de0;
    }

    .item {
      background: #55c987;
    }

    .selected {
      outline: 3px solid white;
      outline-offset: 4px;
    }
    .gameObject.hasSprite {
      background: transparent !important;
      border-color: transparent !important;
    }

    /* =========================================================
       SPRITE
       ========================================================= */

    .spriteCanvas {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      image-rendering: pixelated;
      image-rendering: crisp-edges;

      pointer-events: none;
    }

    /* =========================================================
       SPRITE PANEL
       ========================================================= */

    #spritePreview {
      width: 100%;
      height: 150px;

      display: flex;

      align-items: center;
      justify-content: center;

      margin-bottom: 12px;

      border: 1px solid #444;
      border-radius: 8px;

      background:
        linear-gradient(45deg, #252525 25%, transparent 25%),
        linear-gradient(-45deg, #252525 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #252525 75%),
        linear-gradient(-45deg, transparent 75%, #252525 75%);

      background-size: 20px 20px;

      background-position:
        0 0,
        0 10px,
        10px -10px,
        -10px 0;

      overflow: hidden;
    }

    #spritePreview canvas {
      max-width: 130px;
      max-height: 130px;

      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #spriteStatus {
      color: #777;

      font-size: 12px;
      line-height: 1.4;

      margin-bottom: 10px;
    }

    #openBixelButton {
      width: 100%;

      padding: 11px;

      border: 0;
      border-radius: 7px;

      background: white;
      color: #111;

      font-weight: 900;

      cursor: pointer;
    }

    #openBixelButton:hover {
      filter: brightness(0.9);
    }

    #removeSpriteButton {
      width: 100%;

      padding: 9px;
      margin-top: 8px;

      border: 1px solid #444;
      border-radius: 7px;

      background: #292929;
      color: #ccc;

      font-weight: 700;

      cursor: pointer;
    }

    #removeSpriteButton:hover {
      background: #333;
    }

    /* =========================================================
       NOTIFICATION
       ========================================================= */

    #notification {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform:
        translateX(-50%)
        translateY(20px);

      padding: 12px 18px;

      border-radius: 8px;

      background: #292929;
      border: 1px solid #444;

      color: white;

      font-weight: 700;

      opacity: 0;
      pointer-events: none;

      transition: 0.2s;

      z-index: 1000;
    }

    #notification.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* =========================================================
       PLAY MODE
       ========================================================= */

    body.playMode #sidebar,
    body.playMode #properties {
      display: none;
    }

    body.playMode #engine {
      grid-template-columns: 1fr;
    }

    body.playMode #topbar {
      grid-column: 1;
    }

    body.playMode #workspace {
      grid-column: 1;
      grid-row: 2;

      background: #111;
    }

    body.playMode #workspaceHint {
      display: none;
    }

    body.playMode .gameObject {
      cursor: default;
    }

    body.playMode #playButton {
      display: none;
    }

    body.playMode #stopButton {
      display: block;
    }
  </style>
</head>

<body>

<main id="engine">

  <!-- =======================================================
       TOP BAR
       ======================================================== -->

  <header id="topbar">

    <div id="logo">
      BLANKBOX
    </div>

  <div id="topButtons">

    <button id="backButton">
        ← PROJECTS
    </button>

    <button id="playButton">
        ▶ PLAY
    </button>

    <button id="stopButton">
        ■ EDIT
    </button>

    </div>

  </header>


  <!-- =======================================================
       SIDEBAR
       ======================================================== -->

  <aside id="sidebar">

    <div class="panelTitle">
      CREATE
    </div>

    <button
      class="objectButton"
      data-type="player"
    >
      + Player
    </button>

    <button
      class="objectButton"
      data-type="enemy"
    >
      + Enemy
    </button>

    <button
      class="objectButton"
      data-type="platform"
    >
      + Platform
    </button>

    <button
      class="objectButton"
      data-type="weapon"
    >
      + Weapon
    </button>

    <button
      class="objectButton"
      data-type="npc"
    >
      + NPC
    </button>

    <button
      class="objectButton"
      data-type="item"
    >
      + Item
    </button>
<button id="gameCodeButton">GAME CODE</button>
  </aside>


  <!-- =======================================================
       WORKSPACE
       ======================================================== -->

  <section id="workspace">

    <div id="workspaceHint">
      YOUR GAME GOES HERE
    </div>

  </section>


  <!-- =======================================================
       PROPERTIES
       ======================================================== -->

  <aside id="properties">

    <div class="panelTitle">
      PROPERTIES
    </div>

    <div id="emptyProperties">
      Select an object to edit its properties.
    </div>

    <div id="propertyEditor" hidden>

      <div id="selectedObject"></div>


      <div class="property">

        <label>
          Name
        </label>

        <input
          id="nameInput"
          type="text"
        >

      </div>

<div class="property">

  <label>
    Health Type
  </label>

  <select id="healthTypeInput">
    <option value="hearts">Hearts</option>
    <option value="number">Number</option>
    <option value="bar">Bar</option>
    <option value="oneHit">One Hit</option>
    <option value="none">None</option>
  </select>

</div>


<div class="property" id="maxHealthProperty">

  <label>
    Maximum Health
  </label>

  <input
    id="maxHealthInput"
    type="number"
    min="1"
  >

</div>


<div class="property" id="heartCountProperty">

  <label>
    Hearts
  </label>

  <input
    id="heartCountInput"
    type="number"
    min="1"
  >

</div>


<div class="property">

  <label>
    Damage Per Hit
  </label>

  <input
    id="damagePerHitInput"
    type="number"
    min="1"
  >

</div>


<div class="property">

  <label>
    Invincibility Time
  </label>

  <input
    id="invincibilityInput"
    type="number"
    min="0"
    step="0.1"
  >

</div>


      <div class="property">

        <label>
          Speed
        </label>

        <input
          id="speedInput"
          type="number"
        >

      </div>


      <div class="property">

        <label>
          Behaviors
        </label>

        <div id="behaviors"></div>

      </div>


      <div class="property">

        <label>
          SPRITE
        </label>

        <div id="spritePreview">

          <span style="color:#666;">
            No sprite
          </span>

        </div>

        <div id="spriteStatus">
          This object has no Bixel sprite yet.
        </div>

        <button id="openBixelButton">
          🎨 OPEN BIXEL
        </button>

        <button id="removeSpriteButton">
          Remove Sprite
        </button>

      </div>

    </div>

  </aside>

</main>


<div id="notification"></div>


<script>

/* =========================================================
   BLANK BOX ENGINE
   ========================================================= */

const workspace =
  document.getElementById("workspace");

const workspaceHint =
  document.getElementById("workspaceHint");

const behaviors =
  document.getElementById("behaviors");

const emptyProperties =
  document.getElementById("emptyProperties");

const propertyEditor =
  document.getElementById("propertyEditor");

const selectedObject =
  document.getElementById("selectedObject");

const nameInput =
  document.getElementById("nameInput");

const speedInput =
  document.getElementById("speedInput");

const spritePreview =
  document.getElementById("spritePreview");

const spriteStatus =
  document.getElementById("spriteStatus");

const openBixelButton =
  document.getElementById("openBixelButton");

const removeSpriteButton =
  document.getElementById("removeSpriteButton");

const notification =
  document.getElementById("notification");

const playButton =
  document.getElementById("playButton");

const stopButton =
  document.getElementById("stopButton");
const backButton =
    document.getElementById("backButton");
const gameCodeButton =
  document.getElementById("gameCodeButton");

let gameCode = null;
let objects = [];

let selected = null;

let playMode = false;
let multiplayerMode = false;
let multiplayerHost = false;
let multiplayerConnected = false;

let multiplayerPeer = null;
let multiplayerConnection = null;

let currentGameCode = null;

let localPlayerNumber = null;
let localPlayerId = null;

let hostPlayerId = null;
let guestPlayerId = null;
const healthTypeInput =
  document.getElementById("healthTypeInput");

const maxHealthInput =
  document.getElementById("maxHealthInput");

const heartCountInput =
  document.getElementById("heartCountInput");

const damagePerHitInput =
  document.getElementById("damagePerHitInput");

const invincibilityInput =
  document.getElementById("invincibilityInput");

const maxHealthProperty =
  document.getElementById("maxHealthProperty");

const heartCountProperty =
  document.getElementById("heartCountProperty");

/* =========================================================
   NOTIFICATION
   ========================================================= */

function notify(message) {

  notification.textContent =
    message;

  notification.classList.add(
    "show"
  );

  setTimeout(() => {

    notification.classList.remove(
      "show"
    );

  }, 2200);
}


/* =========================================================
   CREATE OBJECT
   ========================================================= */

function createObject(type) {

  if (playMode)
    return;


  workspaceHint.style.display =
    "none";


  const object = {

    id:
      Date.now() +
      Math.floor(
        Math.random() * 10000
      ),

    type:
      type,

   name:
  type.charAt(0).toUpperCase() +
  type.slice(1),

health: 100,
maxHealth: 100,

healthType:
  type.toLowerCase() === "player"
    ? "hearts"
    : "number",

heartCount:
  type.toLowerCase() === "player"
    ? 7
    : 0,

damagePerHit: 1,

invincibilityTime: 1,
speed: 5,
    aiEnabled:
  type.toLowerCase() === "enemy",

aiBehavior:
  type.toLowerCase() === "enemy"
    ? "chase"
    : null,

aiDetectionRange:
  type.toLowerCase() === "enemy"
    ? 300
    : 0,

aiAttackRange:
  type.toLowerCase() === "enemy"
    ? 40
    : 0,

    behaviors: {

      movement:
        type.toLowerCase() === "player",

      jumping:
        type.toLowerCase() === "player",

      chasePlayer:
        type.toLowerCase() === "enemy",

      contactDamage:
        type.toLowerCase() === "enemy",

      solid:
        type.toLowerCase() === "platform",

      ranged:
        type.toLowerCase() === "weapon",

      dialogue:
        type.toLowerCase() === "npc",

      pickup:
        type.toLowerCase() === "item"

    },

    x:
      100 +
      Math.random() * 300,

    y:
      100 +
      Math.random() * 200,

    spriteCode:
      null

  };


  objects.push(
    object
  );


  /* Render the ACTUAL object */

  renderObject(
    object
  );


  selectObject(
    object
  );


  saveEngine();

}

/* =========================================================
   RENDER OBJECT
   ========================================================= */

function renderObject(object) {

  const element =
    document.createElement(
      "div"
    );

  element.classList.add(
    "gameObject",
    object.type
  );

  if (object.spriteCode) {
    element.classList.add("hasSprite");
  }


  element.classList.add(
    "gameObject",
    object.type
  );


  element.style.left =
    `${object.x}px`;

  element.style.top =
    `${object.y}px`;


  element.dataset.id =
    object.id;


  /* SPRITE CANVAS */

  const spriteCanvas =
    document.createElement(
      "canvas"
    );


  spriteCanvas.className =
    "spriteCanvas";


  spriteCanvas.width = 1;
  spriteCanvas.height = 1;


  element.appendChild(
    spriteCanvas
  );


  /* DRAGGING */

  let dragging = false;

  let offsetX = 0;
  let offsetY = 0;


  element.addEventListener(
    "pointerdown",
    (event) => {

    if (playMode) return;


      event.preventDefault();

      event.stopPropagation();


      selectObject(
        object
      );


      const rect =
        element.getBoundingClientRect();


      offsetX =
        event.clientX -
        rect.left;

      offsetY =
        event.clientY -
        rect.top;


      dragging = true;


      element.setPointerCapture(
        event.pointerId
      );

    }
  );


  element.addEventListener(
    "pointermove",
    (event) => {

      if (
        !dragging ||
        playMode
      )
        return;


      const workspaceRect =
        workspace.getBoundingClientRect();


      let newX =
        event.clientX -
        workspaceRect.left -
        offsetX;


      let newY =
        event.clientY -
        workspaceRect.top -
        offsetY;


      const maxX =
        workspace.clientWidth -
        element.offsetWidth;


      const maxY =
        workspace.clientHeight -
        element.offsetHeight;


      newX =
        Math.max(
          0,
          Math.min(
            newX,
            maxX
          )
        );


      newY =
        Math.max(
          0,
          Math.min(
            newY,
            maxY
          )
        );


      object.x =
        newX;

      object.y =
        newY;


      element.style.left =
        `${newX}px`;

      element.style.top =
        `${newY}px`;

    }
  );


  element.addEventListener(
    "pointerup",
    (event) => {

      dragging = false;


      if (
        element.hasPointerCapture(
          event.pointerId
        )
      ) {

        element.releasePointerCapture(
          event.pointerId
        );

      }


      if (!playMode) {

        selectObject(
          object
        );

        saveEngine();

      }

    }
  );


  element.addEventListener(
    "pointercancel",
    () => {

      dragging = false;

    }
  );


  element.addEventListener(
    "click",
    (event) => {

      if (playMode)
        return;


      event.stopPropagation();

      selectObject(
        object
      );

    }
  );


  object.element =
    element;

  object.spriteCanvas =
    spriteCanvas;


  workspace.appendChild(
    element
  );


  if (object.spriteCode) {

    renderSprite(
      object
    );

  }

}


/* =========================================================
   SELECT OBJECT
   ========================================================= */

function selectObject(object) {

  if (
    playMode ||
    !object ||
    !object.element
  )
    return;


  if (
    selected &&
    selected.element
  ) {

    selected.element.classList.remove(
      "selected"
    );

  }


  selected =
    object;


  selected.element.classList.add(
    "selected"
  );


  emptyProperties.hidden =
    true;

  propertyEditor.hidden =
    false;


  selectedObject.textContent =
    object.type.toUpperCase();


 nameInput.value =
  object.name;

healthTypeInput.value =
  object.healthType || "hearts";

maxHealthInput.value =
  object.maxHealth ?? 100;

heartCountInput.value =
  object.heartCount ?? 7;

damagePerHitInput.value =
  object.damagePerHit ?? 1;

invincibilityInput.value =
  object.invincibilityTime ?? 1;

speedInput.value =
  object.speed;

updateHealthSettings();


  /* BEHAVIORS */

  behaviors.innerHTML = "";


  for (
    const [
      behavior,
      enabled
    ]
    of Object.entries(
      object.behaviors
    )
  ) {

    const label =
      document.createElement(
        "label"
      );


    label.style.display =
      "block";

    label.style.marginBottom =
      "8px";


    const checkbox =
      document.createElement(
        "input"
      );


    checkbox.type =
      "checkbox";

    checkbox.checked =
      enabled;


    checkbox.addEventListener(
      "change",
      () => {

        object.behaviors[
          behavior
        ] =
          checkbox.checked;

        saveEngine();

      }
    );


    label.appendChild(
      checkbox
    );


    label.append(
      " " +
      behavior.replace(
        /([A-Z])/g,
        " $1"
      )
    );


    behaviors.appendChild(
      label
    );

  }


  updateSpritePanel();

}


/* =========================================================
   UPDATE SPRITE PANEL
   ========================================================= */

function updateSpritePanel() {

  if (!selected)
    return;


  spritePreview.innerHTML =
    "";


  if (!selected.spriteCode) {

    spritePreview.innerHTML =
      `<span style="color:#666;">
        No sprite
      </span>`;


    spriteStatus.textContent =
      "This object has no Bixel sprite yet.";


    return;

  }


  const decoded =
    decodeBBX(
      selected.spriteCode
    );


  if (!decoded) {

    spritePreview.innerHTML =
      `<span style="color:#d66;">
        Invalid BBX
      </span>`;


    spriteStatus.textContent =
      "The sprite code could not be decoded.";


    return;

  }


  const previewCanvas =
    document.createElement(
      "canvas"
    );


  previewCanvas.width =
    decoded.size;

  previewCanvas.height =
    decoded.size;


  previewCanvas.style.width =
    "130px";

  previewCanvas.style.height =
    "130px";


  previewCanvas.style.imageRendering =
    "pixelated";


  drawFrame(
    previewCanvas,
    decoded.frames[0]
  );


  spritePreview.appendChild(
    previewCanvas
  );


  spriteStatus.textContent =
    `${decoded.size}×${decoded.size} • ${decoded.frames.length} frame${decoded.frames.length === 1 ? "" : "s"} • ${decoded.fps} FPS`;

}


/* =========================================================
   BBX DECODER
   ========================================================= */

function decodeBBX(code) {

  try {

    if (
      typeof code !== "string"
    )
      return null;


    if (
      !code.startsWith("BBX1|")
    )
      return null;


    const parts =
      code.split("|");


    if (
      parts.length < 4
    )
      return null;


    const size =
      Number(parts[1]);


    const fps =
      Number(parts[2]);


    const frameData =
      parts
        .slice(3)
        .join("|")
        .split("||");


    if (
      !Number.isInteger(size) ||
      size < 1 ||
      size > 256
    )
      return null;


    const frames = [];


    for (
      const encodedFrame
      of frameData
    ) {

      if (!encodedFrame)
        continue;


      const pixels =
        encodedFrame.split(";");


      if (
        pixels.length !==
        size * size
      ) {

        console.warn(
          "Bad frame size",
          pixels.length,
          size * size
        );


        return null;

      }


      const frame = [];


      for (
        const pixel
        of pixels
      ) {

        if (
          pixel === "0"
        ) {

          frame.push({

            transparent: true,

            r: 0,
            g: 0,
            b: 0

          });


          continue;

        }


        const rgb =
          pixel
            .split(",")
            .map(Number);


        if (
          rgb.length !== 3
        )
          return null;


        frame.push({

          transparent: false,

          r: Math.max(
            0,
            Math.min(
              255,
              rgb[0]
            )
          ),

          g: Math.max(
            0,
            Math.min(
              255,
              rgb[1]
            )
          ),

          b: Math.max(
            0,
            Math.min(
              255,
              rgb[2]
            )
          )

        });

      }


      frames.push(
        frame
      );

    }


    if (
      frames.length === 0
    )
      return null;


    return {

      version: "BBX1",

      size: size,

      fps:
        Number.isFinite(fps)
          ? fps
          : 8,

      frames: frames

    };

  }

  catch (error) {

    console.error(
      "BBX decode error:",
      error
    );


    return null;

  }

}


/* =========================================================
   DRAW FRAME
   ========================================================= */

function drawFrame(
  canvas,
  frame
) {

  if (!frame)
    return;


  const ctx =
    canvas.getContext(
      "2d"
    );


  const size =
    Math.sqrt(
      frame.length
    );


  canvas.width =
    size;

  canvas.height =
    size;


  ctx.clearRect(
    0,
    0,
    size,
    size
  );


  const image =
    ctx.createImageData(
      size,
      size
    );


  for (
    let i = 0;
    i < frame.length;
    i++
  ) {

    const pixel =
      frame[i];


    const index =
      i * 4;


    if (
      pixel.transparent
    ) {

      image.data[index] = 0;
      image.data[index + 1] = 0;
      image.data[index + 2] = 0;
      image.data[index + 3] = 0;

    }

    else {

      image.data[index] =
        pixel.r;

      image.data[index + 1] =
        pixel.g;

      image.data[index + 2] =
        pixel.b;

      image.data[index + 3] =
        255;

    }

  }


  ctx.putImageData(
    image,
    0,
    0
  );

}


/* =========================================================
   RENDER SPRITE
   ========================================================= */

function renderSprite(
  object
) {

  if (
    !object ||
    !object.spriteCanvas ||
    !object.spriteCode
  )
    return;


  const decoded =
    decodeBBX(
      object.spriteCode
    );


  if (!decoded)
    return;


  drawFrame(
    object.spriteCanvas,
    decoded.frames[0]
  );


  object.spriteCanvas.style.display =
    "block";

}

 /* =========================================================

let playerObject = null;

let physicsRunning = false;
let physicsFrame = null;
let playStartPositions = new Map();

const GRAVITY = 0.6;
const MAX_FALL_SPEED = 15;

const MOVE_SPEED = 4;
const JUMP_FORCE = 11;


/* ---------------------------------------------------------
   FIND PLAYER
   --------------------------------------------------------- */

function findPlayer() {

  playerObject =
    objects.find(
      object =>
        object.type.toLowerCase() === "player"
    ) || null;


  if (!playerObject) {

    console.warn(
      "BLANK BOX: No Player object found."
    );

    return false;

  }


  if (!playerObject.element) {

    renderObject(
      playerObject
    );

  }


  return true;

}


/* ---------------------------------------------------------
   START PHYSICS
   --------------------------------------------------------- */

function startPhysics() {
  stopPhysics();

  if (!findPlayer()) return;

  // Remember where every object started
  playStartPositions.clear();

  objects.forEach(object => {
    playStartPositions.set(object.id, {
      x: object.x,
      y: object.y
    });
  });

  // Reset player physics
  playerObject.velocityX = 0;
  playerObject.velocityY = 0;
  playerObject.grounded = false;

  physicsRunning = true;
  physicsFrame = requestAnimationFrame(physicsLoop);
}


/* ---------------------------------------------------------
   STOP PHYSICS
   --------------------------------------------------------- */

function stopPhysics() {
  physicsRunning = false;

  if (physicsFrame !== null) {
    cancelAnimationFrame(physicsFrame);
    physicsFrame = null;
  }

  // Put everything back where it was when PLAY started
  objects.forEach(object => {
    const start = playStartPositions.get(object.id);

    if (!start) return;

    object.x = start.x;
    object.y = start.y;

    if (object.element) {
      object.element.style.left = `${object.x}px`;
      object.element.style.top = `${object.y}px`;
    }
  });

  if (playerObject) {
    playerObject.velocityX = 0;
    playerObject.velocityY = 0;
    playerObject.grounded = false;
  }

  playStartPositions.clear();
}
  function updateEnemyAI() {
  if (!playerObject) return;

  for (const enemy of objects) {
    if (!enemy.element) continue;
    if (enemy.type.toLowerCase() !== "enemy") continue;
    if (!enemy.aiEnabled) continue;

    if (enemy.aiBehavior !== "chase") continue;

    const dx = playerObject.x - enemy.x;
    const dy = playerObject.y - enemy.y;

    const distance = Math.sqrt(
      dx * dx + dy * dy
    );

    if (distance > enemy.aiDetectionRange) {
      enemy.velocityX = 0;
      continue;
    }

    if (Math.abs(dx) > 5) {
      enemy.velocityX =
        dx > 0
          ? enemy.speed
          : -enemy.speed;
    } else {
      enemy.velocityX = 0;
    }

    enemy.x += enemy.velocityX;

    enemy.element.style.left =
      `${enemy.x}px`;
  }
}
/* ---------------------------------------------------------
   PHYSICS LOOP
   --------------------------------------------------------- */

function physicsLoop() {

  if (!physicsRunning)
    return;


  if (!playerObject) {

    physicsFrame =
      requestAnimationFrame(
        physicsLoop
      );

    return;

  }


  /* PLAYER VELOCITY */

  if (
    typeof playerObject.velocityX !==
    "number"
  ) {

    playerObject.velocityX = 0;

  }


  if (
    typeof playerObject.velocityY !==
    "number"
  ) {

    playerObject.velocityY = 0;

  }


  /* GRAVITY */
if (
  (keys["Space"] || keys["KeyW"] || keys["ArrowUp"]) &&
  playerObject.grounded
) {
  playerObject.velocityY = -JUMP_FORCE;
  playerObject.grounded = false;
}
  playerObject.velocityY +=
    GRAVITY;


  if (
    playerObject.velocityY >
    MAX_FALL_SPEED
  ) {

    playerObject.velocityY =
      MAX_FALL_SPEED;

  }


  /* MOVEMENT */
if (keys["KeyA"] || keys["ArrowLeft"]) {
  playerObject.velocityX = -MOVE_SPEED;
} else if (keys["KeyD"] || keys["ArrowRight"]) {
  playerObject.velocityX = MOVE_SPEED;
} else {
  playerObject.velocityX = 0;
}
  playerObject.x +=
    playerObject.velocityX;

  playerObject.y +=
    playerObject.velocityY;
  updateEnemyAI();
checkPlatformCollision();

  /* UPDATE VISUAL */

  if (
    playerObject.element
  ) {

    playerObject.element.style.left =
      `${playerObject.x}px`;

    playerObject.element.style.top =
      `${playerObject.y}px`;

  }


  physicsFrame =
    requestAnimationFrame(
      physicsLoop
    );

}
function checkPlatformCollision() {
  const player = playerObject;
  if (!player || !player.element) return;

  const workspaceRect = workspace.getBoundingClientRect();
  const playerRect = player.element.getBoundingClientRect();

  player.grounded = false;

  for (const platform of objects) {
    if (!platform.element) continue;
    if (platform.type.toLowerCase() !== "platform") continue;

    const platformRect = platform.element.getBoundingClientRect();

    const horizontalOverlap =
      playerRect.right > platformRect.left &&
      playerRect.left < platformRect.right;

    const falling =
      player.velocityY >= 0;

    const crossingTop =
      playerRect.bottom >= platformRect.top &&
      playerRect.bottom - player.velocityY <= platformRect.top;

    if (falling && horizontalOverlap && crossingTop) {

      // Convert the platform's screen position
      // back into workspace coordinates.
      const platformTop =
        platformRect.top -
        workspaceRect.top;

      const playerHeight =
        playerRect.height;

      player.y = platformTop - playerHeight;

      player.velocityY = 0;
      player.grounded = true;

      player.element.style.top =
        `${player.y}px`;

      return;
    }
  }
}

    code +=

        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }

  return code;
}

    if (!player) {

    // ===============================
