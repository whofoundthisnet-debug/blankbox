<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlankBox Engine</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #171717;
      color: white;
    }

    #engine {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 220px 1fr 280px;
      grid-template-rows: 60px 1fr;
    }

    /* TOP BAR */
    #topbar {
      grid-column: 1 / 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #222;
      border-bottom: 2px solid #333;
    }

    #logo {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    #playButton {
      padding: 10px 28px;
      border: 0;
      border-radius: 8px;
      background: #72d572;
      color: #111;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    #playButton:hover {
      filter: brightness(1.08);
    }

    /* SIDEBAR */
    #sidebar {
      background: #202020;
      border-right: 2px solid #333;
      padding: 16px;
      overflow-y: auto;
    }

    .panelTitle {
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 900;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .objectButton,
    .spriteButton {
      width: 100%;
      margin-bottom: 8px;
      padding: 12px;
      border: 1px solid #3a3a3a;
      border-radius: 7px;
      background: #292929;
      color: white;
      text-align: left;
      font-weight: 700;
      cursor: pointer;
    }

    .objectButton:hover,
    .spriteButton:hover {
      background: #333;
    }

    /* WORKSPACE */
    #workspace {
      position: relative;
      overflow: hidden;

      background:
        linear-gradient(#242424 1px, transparent 1px),
        linear-gradient(90deg, #242424 1px, transparent 1px);

      background-size: 32px 32px;
    }

    #workspaceHint {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      color: #555;
      font-size: 22px;
      font-weight: 900;

      pointer-events: none;
      user-select: none;
    }

    /* PROPERTIES */
    #properties {
      background: #202020;
      border-left: 2px solid #333;
      padding: 16px;
      overflow-y: auto;
    }

    #selectedObject {
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: 900;
    }

    .property {
      margin-bottom: 14px;
    }

    .property label {
      display: block;
      margin-bottom: 6px;
      color: #aaa;
      font-size: 13px;
      font-weight: 700;
    }

    .property input,
    .property select {
      width: 100%;
      padding: 9px;

      border: 1px solid #444;
      border-radius: 6px;

      background: #292929;
      color: white;

      font-size: 14px;
    }

    #emptyProperties {
      color: #777;
      line-height: 1.5;
    }

    /* OBJECTS */
    .gameObject {
      touch-action: none;

      position: absolute;

      width: 80px;
      height: 80px;

      border: 3px solid white;
      border-radius: 8px;

      cursor: pointer;
      user-select: none;

      overflow: hidden;
    }

    .player {
      background: #5b8cff;
    }

    .enemy {
      background: #e85b5b;
    }

    .platform {
      background: #9a9a9a;
      border-radius: 4px;
    }

    .weapon {
      background: #d69b52;
    }

    .npc {
      background: #a36de0;
    }

    .item {
      background: #55c987;
    }

    .selected {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    /* SPRITE */
    .spriteCanvas {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      image-rendering: pixelated;
      image-rendering: crisp-edges;

      pointer-events: none;
    }

    /* SPRITE PANEL */
    #spritePreview {
      width: 100%;
      height: 150px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 12px;

      border: 1px solid #444;
      border-radius: 8px;

      background:
        linear-gradient(45deg, #252525 25%, transparent 25%),
        linear-gradient(-45deg, #252525 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #252525 75%),
        linear-gradient(-45deg, transparent 75%, #252525 75%);

      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;

      overflow: hidden;
    }

    #spritePreview canvas {
      max-width: 130px;
      max-height: 130px;

      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #spriteStatus {
      color: #777;
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    #openBixelButton {
      width: 100%;
      padding: 11px;

      border: 0;
      border-radius: 7px;

      background: #ffffff;
      color: #111;

      font-weight: 900;
      cursor: pointer;
    }

    #openBixelButton:hover {
      filter: brightness(0.9);
    }

    #removeSpriteButton {
      width: 100%;
      padding: 9px;
      margin-top: 8px;

      border: 1px solid #444;
      border-radius: 7px;

      background: #292929;
      color: #ccc;

      font-weight: 700;
      cursor: pointer;
    }

    #removeSpriteButton:hover {
      background: #333;
    }

    /* NOTIFICATION */
    #notification {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform: translateX(-50%) translateY(20px);

      padding: 12px 18px;

      border-radius: 8px;

      background: #292929;
      border: 1px solid #444;

      color: white;
      font-weight: 700;

      opacity: 0;
      pointer-events: none;

      transition: 0.2s;
      z-index: 1000;
    }

    #notification.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>

<main id="engine">

  <header id="topbar">
    <div id="logo">BLANKBOX</div>

    <button id="playButton">
      ▶ PLAY
    </button>
  </header>


  <aside id="sidebar">

    <div class="panelTitle">
      CREATE
    </div>

    <button class="objectButton" data-type="player">
      + Player
    </button>

    <button class="objectButton" data-type="enemy">
      + Enemy
    </button>

    <button class="objectButton" data-type="platform">
      + Platform
    </button>

    <button class="objectButton" data-type="weapon">
      + Weapon
    </button>

    <button class="objectButton" data-type="npc">
      + NPC
    </button>

    <button class="objectButton" data-type="item">
      + Item
    </button>

  </aside>


  <section id="workspace">

    <div id="workspaceHint">
      YOUR GAME GOES HERE
    </div>

  </section>


  <aside id="properties">

    <div class="panelTitle">
      PROPERTIES
    </div>

    <div id="emptyProperties">
      Select an object to edit its properties.
    </div>


    <div id="propertyEditor" hidden>

      <div id="selectedObject"></div>


      <div class="property">

        <label>
          Name
        </label>

        <input
          id="nameInput"
          type="text"
        >

      </div>


      <div class="property">

        <label>
          Health
        </label>

        <input
          id="healthInput"
          type="number"
        >

      </div>


      <div class="property">

        <label>
          Speed
        </label>

        <input
          id="speedInput"
          type="number"
        >

      </div>


      <div class="property">

        <label>
          Behaviors
        </label>

        <div id="behaviors"></div>

      </div>


      <div class="property">

        <label>
          SPRITE
        </label>

        <div id="spritePreview">
          <span style="color:#666;">
            No sprite
          </span>
        </div>

        <div id="spriteStatus">
          This object has no Bixel sprite yet.
        </div>

        <button id="openBixelButton">
          🎨 OPEN BIXEL
        </button>

        <button id="removeSpriteButton">
          Remove Sprite
        </button>

      </div>

    </div>

  </aside>

</main>


<div id="notification"></div>


<script>

/* =========================================================
   BLANK BOX ENGINE
   ========================================================= */

const workspace =
  document.getElementById("workspace");

const workspaceHint =
  document.getElementById("workspaceHint");

const behaviors =
  document.getElementById("behaviors");

const emptyProperties =
  document.getElementById("emptyProperties");

const propertyEditor =
  document.getElementById("propertyEditor");

const selectedObject =
  document.getElementById("selectedObject");

const nameInput =
  document.getElementById("nameInput");

const healthInput =
  document.getElementById("healthInput");

const speedInput =
  document.getElementById("speedInput");

const spritePreview =
  document.getElementById("spritePreview");

const spriteStatus =
  document.getElementById("spriteStatus");

const openBixelButton =
  document.getElementById("openBixelButton");

const removeSpriteButton =
  document.getElementById("removeSpriteButton");

const notification =
  document.getElementById("notification");


let objects = [];

let selected = null;


/* =========================================================
   NOTIFICATION
   ========================================================= */

function notify(message) {

  notification.textContent = message;

  notification.classList.add("show");

  setTimeout(() => {

    notification.classList.remove("show");

  }, 2200);
}


/* =========================================================
   CREATE OBJECT
   ========================================================= */

function createObject(type) {

  workspaceHint.style.display = "none";

  const object = {

    id:
      Date.now() +
      Math.floor(Math.random() * 10000),

    type: type,

    name:
      type.charAt(0).toUpperCase() +
      type.slice(1),

    health: 100,

    speed: 5,

    behaviors: {

      movement:
        type === "player",

      jumping:
        type === "player",

      chasePlayer:
        type === "enemy",

      contactDamage:
        type === "enemy",

      solid:
        type === "platform",

      ranged:
        type === "weapon",

      dialogue:
        type === "npc",

      pickup:
        type === "item"

    },

    x:
      100 +
      Math.random() * 300,

    y:
      100 +
      Math.random() * 200,

    spriteCode: null

  };

  objects.push(object);

  renderObject(object);

  selectObject(object);

  saveEngine();

}


/* =========================================================
   RENDER OBJECT
   ========================================================= */

function renderObject(object) {

  const element =
    document.createElement("div");

  element.classList.add(
    "gameObject",
    object.type
  );

  element.style.left =
    `${object.x}px`;

  element.style.top =
    `${object.y}px`;

  element.dataset.id =
    object.id;


  /*
    SPRITE CANVAS
  */

  const spriteCanvas =
    document.createElement("canvas");

  spriteCanvas.className =
    "spriteCanvas";

  spriteCanvas.width = 1;
  spriteCanvas.height = 1;

  element.appendChild(
    spriteCanvas
  );


  /*
    DRAGGING
  */

  let dragging = false;

  let offsetX = 0;
  let offsetY = 0;


  element.addEventListener(
    "pointerdown",
    (event) => {

      event.preventDefault();

      event.stopPropagation();

      selectObject(object);


      const rect =
        element.getBoundingClientRect();

      offsetX =
        event.clientX -
        rect.left;

      offsetY =
        event.clientY -
        rect.top;


      dragging = true;

      element.setPointerCapture(
        event.pointerId
      );

    }
  );


  element.addEventListener(
    "pointermove",
    (event) => {

      if (!dragging)
        return;


      const workspaceRect =
        workspace.getBoundingClientRect();


      let newX =
        event.clientX -
        workspaceRect.left -
        offsetX;


      let newY =
        event.clientY -
        workspaceRect.top -
        offsetY;


      const maxX =
        workspace.clientWidth -
        element.offsetWidth;


      const maxY =
        workspace.clientHeight -
        element.offsetHeight;


      newX =
        Math.max(
          0,
          Math.min(
            newX,
            maxX
          )
        );


      newY =
        Math.max(
          0,
          Math.min(
            newY,
            maxY
          )
        );


      object.x = newX;
      object.y = newY;


      element.style.left =
        `${newX}px`;

      element.style.top =
        `${newY}px`;

    }
  );


  element.addEventListener(
    "pointerup",
    (event) => {

      dragging = false;


      if (
        element.hasPointerCapture(
          event.pointerId
        )
      ) {

        element.releasePointerCapture(
          event.pointerId
        );

      }


      selectObject(object);

      saveEngine();

    }
  );


  element.addEventListener(
    "pointercancel",
    () => {

      dragging = false;

    }
  );


  element.addEventListener(
    "click",
    (event) => {

      event.stopPropagation();

      selectObject(object);

    }
  );


  object.element =
    element;

  object.spriteCanvas =
    spriteCanvas;


  workspace.appendChild(
    element
  );


  /*
    If object already has
    a sprite, rebuild it.
  */

  if (object.spriteCode) {

    renderSprite(
      object
    );

  }

}


/* =========================================================
   SELECT OBJECT
   ========================================================= */

function selectObject(object) {

  if (
    selected &&
    selected.element
  ) {

    selected.element.classList.remove(
      "selected"
    );

  }


  selected = object;


  selected.element.classList.add(
    "selected"
  );


  emptyProperties.hidden =
    true;

  propertyEditor.hidden =
    false;


  selectedObject.textContent =
    object.type.toUpperCase();


  nameInput.value =
    object.name;

  healthInput.value =
    object.health;

  speedInput.value =
    object.speed;


  /*
    BEHAVIORS
  */

  behaviors.innerHTML = "";


  for (
    const [
      behavior,
      enabled
    ]
    of Object.entries(
      object.behaviors
    )
  ) {

    const label =
      document.createElement(
        "label"
      );

    label.style.display =
      "block";

    label.style.marginBottom =
      "8px";


    const checkbox =
      document.createElement(
        "input"
      );

    checkbox.type =
      "checkbox";

    checkbox.checked =
      enabled;


    checkbox.addEventListener(
      "change",
      () => {

        object.behaviors[
          behavior
        ] =
          checkbox.checked;

        saveEngine();

      }
    );


    label.appendChild(
      checkbox
    );


    label.append(
      " " +
      behavior.replace(
        /([A-Z])/g,
        " $1"
      )
    );


    behaviors.appendChild(
      label
    );

  }


  /*
    SPRITE
  */

  updateSpritePanel();

}


/* =========================================================
   UPDATE SPRITE PANEL
   ========================================================= */

function updateSpritePanel() {

  if (!selected)
    return;


  spritePreview.innerHTML = "";


  if (
    !selected.spriteCode
  ) {

    spritePreview.innerHTML =
      `<span style="color:#666;">
        No sprite
      </span>`;

    spriteStatus.textContent =
      "This object has no Bixel sprite yet.";

    return;

  }


  const decoded =
    decodeBBX(
      selected.spriteCode
    );


  if (!decoded) {

    spritePreview.innerHTML =
      `<span style="color:#d66;">
        Invalid BBX
      </span>`;

    spriteStatus.textContent =
      "The sprite code could not be decoded.";

    return;

  }


  const previewCanvas =
    document.createElement(
      "canvas"
    );


  previewCanvas.width =
    decoded.size;

  previewCanvas.height =
    decoded.size;


  previewCanvas.style.width =
    "130px";

  previewCanvas.style.height =
    "130px";


  previewCanvas.style.imageRendering =
    "pixelated";


  drawFrame(
    previewCanvas,
    decoded.frames[0]
  );


  spritePreview.appendChild(
    previewCanvas
  );


  spriteStatus.textContent =
    `${decoded.size}×${decoded.size} • ${decoded.frames.length} frame${decoded.frames.length === 1 ? "" : "s"} • ${decoded.fps} FPS`;

}


/* =========================================================
   BBX DECODER
   ========================================================= */

function decodeBBX(code) {

  try {

    if (
      typeof code !== "string"
    )
      return null;


    if (
      !code.startsWith("BBX1|")
    )
      return null;


    const parts =
      code.split("|");


    if (
      parts.length < 4
    )
      return null;


    const size =
      Number(parts[1]);


    const fps =
      Number(parts[2]);


    const frameData =
      parts
        .slice(3)
        .join("|")
        .split("||");


    if (
      !Number.isInteger(size) ||
      size < 1 ||
      size > 256
    )
      return null;


    const frames = [];


    for (
      const encodedFrame
      of frameData
    ) {

      if (
        !encodedFrame
      )
        continue;


      const pixels =
        encodedFrame.split(";");


      if (
        pixels.length !==
        size * size
      ) {

        console.warn(
          "Bad frame size",
          pixels.length,
          size * size
        );

        return null;

      }


      const frame = [];


      for (
        const pixel
        of pixels
      ) {

        if (
          pixel === "0"
        ) {

          frame.push({
            transparent: true,
            r: 0,
            g: 0,
            b: 0
          });

          continue;

        }


        const rgb =
          pixel.split(",").map(
            Number
          );


        if (
          rgb.length !== 3
        )
          return null;


        frame.push({

          transparent: false,

          r: Math.max(
            0,
            Math.min(
              255,
              rgb[0]
            )
          ),

          g: Math.max(
            0,
            Math.min(
              255,
              rgb[1]
            )
          ),

          b: Math.max(
            0,
            Math.min(
              255,
              rgb[2]
            )
          )

        });

      }


      frames.push(frame);

    }


    if (
      frames.length === 0
    )
      return null;


    return {

      version: "BBX1",

      size: size,

      fps:
        Number.isFinite(fps)
          ? fps
          : 8,

      frames: frames

    };

  }

  catch (error) {

    console.error(
      "BBX decode error:",
      error
    );

    return null;

  }

}


/* =========================================================
   DRAW FRAME
   ========================================================= */

function drawFrame(
  canvas,
  frame
) {

  if (!frame)
    return;


  const ctx =
    canvas.getContext(
      "2d"
    );


  const size =
    Math.sqrt(
      frame.length
    );


  canvas.width =
    size;

  canvas.height =
    size;


  ctx.clearRect(
    0,
    0,
    size,
    size
  );


  const image =
    ctx.createImageData(
      size,
      size
    );


  for (
    let i = 0;
    i < frame.length;
    i++
  ) {

    const pixel =
      frame[i];


    const index =
      i * 4;


    if (
      pixel.transparent
    ) {

      image.data[index] =
        0;

      image.data[index + 1] =
        0;

      image.data[index + 2] =
        0;

      image.data[index + 3] =
        0;

    }

    else {

      image.data[index] =
        pixel.r;

      image.data[index + 1] =
        pixel.g;

      image.data[index + 2] =
        pixel.b;

      image.data[index + 3] =
        255;

    }

  }


  ctx.putImageData(
    image,
    0,
    0
  );

}


/* =========================================================
   RENDER SPRITE ON OBJECT
   ========================================================= */

function renderSprite(
  object
) {

  if (
    !object ||
    !object.spriteCanvas ||
    !object.spriteCode
  )
    return;


  const decoded =
    decodeBBX(
      object.spriteCode
    );


  if (!decoded)
    return;


  drawFrame(
    object.spriteCanvas,
    decoded.frames[0]
  );


  object.spriteCanvas.style.display =
    "block";

}


/* =========================================================
   OPEN BIXEL
   ========================================================= */

openBixelButton.addEventListener(
  "click",
  () => {

    if (!selected)
      return;


    /*
      Tell Bixel which Blank Box
      object we're editing.
    */

    localStorage.setItem(
      "blankbox_bixel_target",
      String(selected.id)
    );


    /*
      Save engine first.
    */

    saveEngine();


    /*
      Open Bixel.
    */

    window.location.href =
      "bixel.html";

  }
);


/* =========================================================
   REMOVE SPRITE
   ========================================================= */

removeSpriteButton.addEventListener(
  "click",
  () => {

    if (!selected)
      return;


    selected.spriteCode =
      null;


    selected.spriteCanvas
      .getContext("2d")
      .clearRect(
        0,
        0,
        selected.spriteCanvas.width,
        selected.spriteCanvas.height
      );


    updateSpritePanel();

    saveEngine();

    notify(
      "Sprite removed."
    );

  }
);


/* =========================================================
   INPUTS
   ========================================================= */

nameInput.addEventListener(
  "input",
  () => {

    if (!selected)
      return;


    selected.name =
      nameInput.value;


    saveEngine();

  }
);


healthInput.addEventListener(
  "input",
  () => {

    if (!selected)
      return;


    selected.health =
      Number(
        healthInput.value
      ) || 0;


    saveEngine();

  }
);


speedInput.addEventListener(
  "input",
  () => {

    if (!selected)
      return;


    selected.speed =
      Number(
        speedInput.value
      ) || 0;


    saveEngine();

  }
);


/* =========================================================
   CREATE BUTTONS
   ========================================================= */

document
  .querySelectorAll(
    ".objectButton"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          createObject(
            button.dataset.type
          );

        }
      );

    }
  );


/* =========================================================
   WORKSPACE DESELECT
   ========================================================= */

workspace.addEventListener(
  "click",
  () => {

    if (
      selected &&
      selected.element
    ) {

      selected.element.classList.remove(
        "selected"
      );

    }


    selected = null;


    emptyProperties.hidden =
      false;

    propertyEditor.hidden =
      true;

  }
);


/* =========================================================
   SAVE ENGINE
   ========================================================= */

function saveEngine() {

  /*
    Remove DOM references before saving.
  */

  const cleanObjects =
    objects.map(
      object => ({

        id: object.id,

        type: object.type,

        name: object.name,

        health: object.health,

        speed: object.speed,

        behaviors:
          object.behaviors,

        x: object.x,

        y: object.y,

        spriteCode:
          object.spriteCode || null

      })
    );


  localStorage.setItem(
    "blankbox_engine_objects",
    JSON.stringify(
      cleanObjects
    )
  );

}


/* =========================================================
   LOAD ENGINE
   ========================================================= */

function loadEngine() {

  const saved =
    localStorage.getItem(
      "blankbox_engine_objects"
    );


  if (!saved)
    return;


  try {

    const loaded =
      JSON.parse(saved);


    if (
      !Array.isArray(
        loaded
      )
    )
      return;


    for (
      const object
      of loaded
    ) {

      objects.push(
        object
      );


      renderObject(
        object
      );

    }


    if (
      objects.length > 0
    ) {

      workspaceHint.style.display =
        "none";

    }

  }

  catch (error) {

    console.error(
      "Could not load Blank Box:",
      error
    );

  }

}


/* =========================================================
   RECEIVE BIXEL SPRITE
   ========================================================= */

function receiveBixelSprite() {

  const code =
    localStorage.getItem(
      "blankbox_bixel_code"
    );


  const targetId =
    localStorage.getItem(
      "blankbox_bixel_target"
    );


  if (
    !code ||
    !targetId
  )
    return;


  const target =
    objects.find(
      object =>
        String(object.id) ===
        String(targetId)
    );


  if (!target)
    return;


  /*
    Give the object the sprite.
  */

  target.spriteCode =
    code;


  /*
    Draw it.
  */

  renderSprite(
    target
  );


  /*
    Select it so the user
    immediately sees the sprite.
  */

  selectObject(
    target
  );


  /*
    Clear the target so
    it doesn't get assigned
    again on every reload.
  */

  localStorage.removeItem(
    "blankbox_bixel_target"
  );


  /*
    Keep the sprite code.
  */

  saveEngine();


  notify(
    "Bixel sprite added!"
  );

}


/* =========================================================
   PLAY BUTTON
   ========================================================= */

document
  .getElementById(
    "playButton"
  )
  .addEventListener(
    "click",
    () => {

      alert(
        "PLAY mode coming next."
      );

    }
  );


/* =========================================================
   START ENGINE
   ========================================================= */

loadEngine();

receiveBixelSprite();

</script>
