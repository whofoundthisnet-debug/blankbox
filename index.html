<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlankBox</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f1e8;
      font-family: Arial, Helvetica, sans-serif;
    }

    #blankbox {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #scene {
      position: absolute;
      inset: 0;
    }

    .word {
      position: absolute;
      font-size: clamp(60px, 12vw, 170px);
      font-weight: 900;
      letter-spacing: -0.06em;
      color: #111;
      z-index: 20;
      user-select: none;
    }

    #here {
      left: 7%;
      top: 38%;
    }

    #there {
      right: 7%;
      top: 38%;
    }
#boxOpening {
  position: absolute;
  left: 10%;
  top: 5%;
  width: 80%;
  height: 42%;
  background: #5d3b18;
  border: 5px solid #70491f;
  z-index: 2;
  overflow: hidden;
}
  #box {
  position: absolute;
  left: 50%;
  top: 58%;
  width: min(520px, 62vw);
  height: min(360px, 44vw);
  transform: translate(-50%, -50%);
  z-index: 10;
  perspective: 900px;
}

    #boxLabel {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(24px, 4vw, 52px);
      font-weight: 900;
      color: #5d3b18;
      z-index: 2;
    }

    #status {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      font-size: clamp(18px, 2vw, 28px);
      font-weight: 800;
      color: #111;
      z-index: 30;
      text-align: center;
    }
  </style>
</head>

<body>
  <main id="blankbox">
    <div id="scene">
      <div id="here" class="word">HERE</div>
      <div id="there" class="word">THERE</div>

     <div id="box">
  <div class="box-inside"></div>
  <div id="backFlap" class="flap"></div>
  <div id="frontFlap" class="flap"></div>
  <div id="boxOpening"></div>
  <div class="box-body">
  </div>
</div>

<div id="tapeShot">
  <div id="tapeBox">
    <div id="tape">
      <div id="doneText">DONE</div>
    </div>
  </div>
</div>

      <div id="status">Loading...</div>
    </div>
  </main>

<script>
  const scene = document.getElementById("scene");
  const box = document.getElementById("box");
  const here = document.getElementById("here");
  const there = document.getElementById("there");
  const tapeShot = document.getElementById("tapeShot");
  const tape = document.getElementById("tape");

  const junkShapes = [
    "◆", "●", "■", "▲",
    "★", "✦", "⬟", "✚"
  ];

  function createJunk(side, delayOffset = 0) {
    junkShapes.forEach((shape, index) => {
      const item = document.createElement("div");

      item.textContent = shape;
      item.style.position = "absolute";
      item.style.fontSize = `${28 + Math.random() * 32}px`;
      item.style.fontWeight = "900";
      item.style.color = "#111";
      item.style.zIndex = "1";

      const startY = 20 + Math.random() * 55;

      if (side === "left") {
        item.style.left = "-80px";
      } else {
        item.style.left = "calc(100% + 80px)";
      }

      item.style.top = `${startY}%`;

      scene.appendChild(item);

      setTimeout(() => {
        const boxRect = box.getBoundingClientRect();
        const sceneRect = scene.getBoundingClientRect();

        /*
          TARGET = the opening at the TOP of the box.
          This is intentionally ABOVE the front face.
        */

        const openingX =
          boxRect.left -
          sceneRect.left +
          boxRect.width / 2;

        const openingY =
  boxRect.top -
  sceneRect.top +
  boxRect.height * 0.12;
        
        const itemStartX = side === "left"
          ? -80
          : sceneRect.width + 80;

        const itemStartY =
          (startY / 100) * sceneRect.height;

        const horizontalDistance =
          openingX - itemStartX;

        const verticalDistance =
          openingY - itemStartY;

        /*
          Phase 1:
          Fly toward the opening.
        */

        item.animate(
          [
            {
              transform: "translate(0, 0) rotate(0deg) scale(1)",
              opacity: 0
            },
            {
              transform:
                `translate(${horizontalDistance}px,
                ${verticalDistance}px)
                rotate(${180 + Math.random() * 360}deg)
                scale(1)`,
              opacity: 1
            }
          ],
          {
            duration: 1100,
            easing: "cubic-bezier(.15,.8,.25,1)",
            fill: "forwards"
          }
        ).finished.then(() => {

          /*
            Phase 2:
            The junk is now ABOVE THE OPENING.
            Drop it straight down.
          */

          item.animate(
            [
              {
                transform:
                  `translate(${horizontalDistance}px,
                  ${verticalDistance}px)
                  rotate(360deg)
                  scale(1)`,
                opacity: 1
              },
              {
                transform:
                  `translate(${horizontalDistance}px,
                  ${verticalDistance + boxRect.height * 0.65)
                  rotate(540deg)
                  scale(0.45)`,
                opacity: 0
              }
            ],
            {
              duration: 500,
              easing: "ease-in",
              fill: "forwards"
            }
          ).finished.then(() => {
            item.remove();
          });

        });

      }, delayOffset + index * 180);
    });
  }

  /*
    HERE
    */

  createJunk("left", 0);

  /*
    Open the box before the junk reaches it.
    */

  setTimeout(() => {
    box.classList.add("open");
  }, 800);

  /*
    THERE
    */

  setTimeout(() => {
    here.style.opacity = "0";
    there.style.opacity = "1";

    createJunk("right", 0);
  }, 2800);

  /*
    Close box after the second batch.
    */

  setTimeout(() => {
    box.classList.remove("open");
  }, 4500);

  /*
    Tape shot.
    */

  setTimeout(() => {
    box.style.display = "none";
    here.style.display = "none";
    there.style.display = "none";

    tapeShot.style.display = "flex";

    setTimeout(() => {
      tape.classList.add("done");
    }, 300);

  }, 5300);

  /*
    Final launcher text.
    */

  setTimeout(() => {
    document.getElementById("status").textContent =
      "BLANKBOX — PRESS ENTER";
  }, 6200);
</script>
</body>
</html>
