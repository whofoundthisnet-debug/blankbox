<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlankBox</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f1e8;
      font-family: Arial, Helvetica, sans-serif;
    }

    #blankbox {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #scene {
      position: absolute;
      inset: 0;
    }

    .word {
      position: absolute;
      font-size: clamp(60px, 12vw, 170px);
      font-weight: 900;
      letter-spacing: -0.06em;
      color: #111;
      z-index: 20;
      user-select: none;
    }

    #here {
      left: 7%;
      top: 38%;
    }

    #there {
      right: 7%;
      top: 38%;
    }

    #box {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(280px, 42vw);
      aspect-ratio: 1.25;
      transform: translate(-50%, -50%);
      background: #d7a35d;
      border: 6px solid #9b6b35;
      border-radius: 8px;
      z-index: 10;
    }

    #box::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 24%;
      height: 100%;
      transform: translateX(-50%);
      background: #e8c17c;
      opacity: 0.8;
    }

    #boxLabel {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(24px, 4vw, 52px);
      font-weight: 900;
      color: #5d3b18;
      z-index: 2;
    }

    #status {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      font-size: clamp(18px, 2vw, 28px);
      font-weight: 800;
      color: #111;
      z-index: 30;
      text-align: center;
    }
  </style>
</head>

<body>
  <main id="blankbox">
    <div id="scene">
      <div id="here" class="word">HERE</div>
      <div id="there" class="word">THERE</div>

      <div id="box">
        <div id="boxLabel">BLANK</div>
      </div>

      <div id="status">Loading...</div>
    </div>
  </main>

  
   <script>
  const scene = document.getElementById("scene");

  const junk = [
    "◆",
    "●",
    "■",
    "▲",
    "★",
    "✦",
    "⬟",
    "✚"
  ];

  junk.forEach((shape, index) => {
    const item = document.createElement("div");

    item.textContent = shape;
    item.style.position = "absolute";
    item.style.left = "-100px";
    item.style.top = `${20 + Math.random() * 60}%`;
    item.style.fontSize = `${25 + Math.random() * 35}px`;
    item.style.fontWeight = "900";
    item.style.color = "#111";
    item.style.zIndex = "15";

    scene.appendChild(item);

    const delay = index * 180;

    setTimeout(() => {
      item.animate(
        [
          {
            transform: "translateX(0) rotate(0deg)",
            opacity: 0
          },
          {
            transform: `translateX(${20 + Math.random() * 25}vw) rotate(${180 + Math.random() * 360}deg)`,
            opacity: 1
          }
        ],
        {
          duration: 900,
          easing: "cubic-bezier(.2,.8,.2,1)",
          fill: "forwards"
        }
      );
    }, delay);
  });
</script>
</body>
</html>
