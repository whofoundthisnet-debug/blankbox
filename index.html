<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlankBox</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f1e8;
      font-family: Arial, Helvetica, sans-serif;
    }

    #blankbox {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #scene {
      position: absolute;
      inset: 0;
    }

    .word {
      position: absolute;
      font-size: clamp(60px, 12vw, 170px);
      font-weight: 900;
      letter-spacing: -0.06em;
      color: #111;
      z-index: 20;
      user-select: none;
    }

    #here {
      left: 7%;
      top: 38%;
    }

    #there {
      right: 7%;
      top: 38%;
    }

    #box {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(280px, 42vw);
      aspect-ratio: 1.25;
      transform: translate(-50%, -50%);
      background: #d7a35d;
      border: 6px solid #9b6b35;
      border-radius: 8px;
      z-index: 10;
    }

    #box::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 24%;
      height: 100%;
      transform: translateX(-50%);
      background: #e8c17c;
      opacity: 0.8;
    }

    #boxLabel {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(24px, 4vw, 52px);
      font-weight: 900;
      color: #5d3b18;
      z-index: 2;
    }

    #status {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      font-size: clamp(18px, 2vw, 28px);
      font-weight: 800;
      color: #111;
      z-index: 30;
      text-align: center;
    }
  </style>
</head>

<body>
  <main id="blankbox">
    <div id="scene">
      <div id="here" class="word">HERE</div>
      <div id="there" class="word">THERE</div>

      <div id="box">
        <div id="boxLabel">BLANK</div>
      </div>

      <div id="status">Loading...</div>
    </div>
  </main>

  <style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f4f1e8;
    font-family: Arial, Helvetica, sans-serif;
  }

  #blankbox {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #scene {
    position: absolute;
    inset: 0;
  }

  .word {
    position: absolute;
    font-size: clamp(60px, 12vw, 170px);
    font-weight: 900;
    letter-spacing: -0.06em;
    color: #111;
    z-index: 40;
    user-select: none;
  }

  #here {
    left: 7%;
    top: 38%;
  }

  #there {
    right: 7%;
    top: 38%;
  }

  /* THE BOX */

  #box {
    position: absolute;
    left: 50%;
    top: 55%;
    width: min(280px, 42vw);
    height: min(220px, 32vw);
    transform: translate(-50%, -50%);
    z-index: 10;
    perspective: 700px;
  }

  .box-body {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 72%;
    background: #d7a35d;
    border: 6px solid #9b6b35;
    border-radius: 4px;
    overflow: hidden;
  }

  .box-body::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 20%;
    height: 100%;
    transform: translateX(-50%);
    background: #e8c17c;
    opacity: 0.75;
  }

  .box-inside {
    position: absolute;
    left: 7%;
    right: 7%;
    top: 10%;
    height: 58%;
    background: #9b6b35;
    border: 5px solid #70491f;
    z-index: 1;
    overflow: hidden;
  }

  .box-inside::after {
    content: "";
    position: absolute;
    inset: 10px;
    background: #6f4a27;
  }

  /* Top flaps */

  .flap {
    position: absolute;
    left: 4%;
    width: 92%;
    height: 30%;
    background: #d7a35d;
    border: 6px solid #9b6b35;
    transform-origin: bottom center;
    z-index: 8;
  }

  #backFlap {
    top: 3%;
    transform: perspective(500px) rotateX(0deg);
  }

  #frontFlap {
    bottom: 50%;
    transform-origin: top center;
    transform: perspective(500px) rotateX(0deg);
  }

  /* Opening animation */

  #box.open .box-inside {
    opacity: 1;
  }

  #box.open #backFlap {
    animation: backOpen 0.7s ease forwards;
  }

  #box.open #frontFlap {
    animation: frontOpen 0.7s ease forwards;
  }

  @keyframes backOpen {
    to {
      transform: perspective(500px) rotateX(75deg);
      transform-origin: bottom center;
    }
  }

  @keyframes frontOpen {
    to {
      transform: perspective(500px) rotateX(-65deg);
      transform-origin: top center;
    }
  }

  /* Tape */

  #tapeShot {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    background: #f4f1e8;
  }

  #tapeBox {
    position: relative;
    width: min(420px, 70vw);
    aspect-ratio: 1.25;
    background: #d7a35d;
    border: 8px solid #9b6b35;
    border-radius: 5px;
  }

  #tape {
    position: absolute;
    left: 50%;
    top: -5%;
    width: 25%;
    height: 110%;
    transform: translateX(-50%) scaleY(0);
    transform-origin: center;
    background: #e7d38c;
    border-left: 3px solid #c6ad62;
    border-right: 3px solid #c6ad62;
  }

  #tape.done {
    animation: tapeDown 0.65s ease forwards;
  }

  @keyframes tapeDown {
    from {
      transform: translateX(-50%) scaleY(0);
    }

    to {
      transform: translateX(-50%) scaleY(1);
    }
  }

  #doneText {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    font-size: clamp(28px, 5vw, 55px);
    font-weight: 900;
    color: #5d4a20;
    white-space: nowrap;
  }

  #status {
    position: absolute;
    left: 50%;
    bottom: 7%;
    transform: translateX(-50%);
    font-size: clamp(18px, 2vw, 28px);
    font-weight: 800;
    color: #111;
    z-index: 120;
    text-align: center;
  }
</style>
</body>
</html>
