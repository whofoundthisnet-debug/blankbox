<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlankBox</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f1e8;
      font-family: Arial, Helvetica, sans-serif;
    }

    #blankbox {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #scene {
      position: absolute;
      inset: 0;
    }

    .word {
      position: absolute;
      font-size: clamp(60px, 12vw, 170px);
      font-weight: 900;
      letter-spacing: -0.06em;
      color: #111;
      z-index: 20;
      user-select: none;
    }

    #here {
      left: 7%;
      top: 38%;
    }

    #there {
      right: 7%;
      top: 38%;
    }

    #box {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(280px, 42vw);
      aspect-ratio: 1.25;
      transform: translate(-50%, -50%);
      background: #d7a35d;
      border: 6px solid #9b6b35;
      border-radius: 8px;
      z-index: 10;
    }

    #box::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 24%;
      height: 100%;
      transform: translateX(-50%);
      background: #e8c17c;
      opacity: 0.8;
    }

    #boxLabel {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(24px, 4vw, 52px);
      font-weight: 900;
      color: #5d3b18;
      z-index: 2;
    }

    #status {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      font-size: clamp(18px, 2vw, 28px);
      font-weight: 800;
      color: #111;
      z-index: 30;
      text-align: center;
    }
  </style>
</head>

<body>
  <main id="blankbox">
    <div id="scene">
      <div id="here" class="word">HERE</div>
      <div id="there" class="word">THERE</div>

     <div id="box">
  <div class="box-inside"></div>
  <div id="backFlap" class="flap"></div>
  <div id="frontFlap" class="flap"></div>

  <div class="box-body">
  </div>
</div>

<div id="tapeShot">
  <div id="tapeBox">
    <div id="tape">
      <div id="doneText">DONE</div>
    </div>
  </div>
</div>

      <div id="status">Loading...</div>
    </div>
  </main>

  <script>
  const scene = document.getElementById("scene");
  const box = document.getElementById("box");
  const here = document.getElementById("here");
  const there = document.getElementById("there");
  const tapeShot = document.getElementById("tapeShot");
  const tape = document.getElementById("tape");

  const junkShapes = [
    "◆",
    "●",
    "■",
    "▲",
    "★",
    "✦",
    "⬟",
    "✚"
  ];

  function createJunk(side) {
    junkShapes.forEach((shape, index) => {
      const item = document.createElement("div");

      item.textContent = shape;
      item.style.position = "absolute";
      item.style.fontSize = `${25 + Math.random() * 35}px`;
      item.style.fontWeight = "900";
      item.style.color = "#111";
      item.style.zIndex = "30";

      const startX = side === "left"
        ? "-80px"
        : "calc(100% + 80px)";

      item.style.left = startX;
      item.style.top = `${25 + Math.random() * 45}%`;

      scene.appendChild(item);

      setTimeout(() => {
        const boxRect = box.getBoundingClientRect();
        const sceneRect = scene.getBoundingClientRect();

        const targetX =
          boxRect.left -
          sceneRect.left +
          boxRect.width / 2 -
          20;

        const targetY =
          boxRect.top -
          sceneRect.top +
          boxRect.height * 0.45;

        const startY = item.offsetTop;

        item.animate(
          [
            {
              transform: "translate(0, 0) rotate(0deg) scale(1)",
              opacity: 0
            },
            {
              transform:
                `translate(${side === "left" ? targetX : targetX - sceneRect.width}px,
                ${targetY - startY}px)
                rotate(${360 + Math.random() * 500}deg)
                scale(0.2)`,
              opacity: 1
            }
          ],
          {
            duration: 1300,
            easing: "cubic-bezier(.15,.75,.25,1)",
            fill: "forwards"
          }
        ).finished.then(() => {
          item.remove();
        });
      }, index * 130);
    });
  }

  /*
    STEP 1:
    HERE appears.
    Junk comes from the left.
  */

  createJunk("left");

  /*
    STEP 2:
    Box opens after the first junk arrives.
  */

  setTimeout(() => {
    box.classList.add("open");
  }, 900);

  /*
    STEP 3:
    THERE appears and more junk comes from the right.
  */

  setTimeout(() => {
    here.style.opacity = "0";
    there.style.opacity = "1";

    createJunk("right");
  }, 2300);

  /*
    STEP 4:
    After everything is inside,
    switch to the special top-down tape shot.
  */

  setTimeout(() => {
    box.style.display = "none";
    here.style.display = "none";
    there.style.display = "none";

    tapeShot.style.display = "flex";

    setTimeout(() => {
      tape.classList.add("done");
    }, 400);
  }, 4100);

  /*
    STEP 5:
    Eventually this will become the BLANKBOX
    PRESS ENTER screen.
  */

  setTimeout(() => {
    document.getElementById("status").textContent =
      "BLANKBOX — PRESS ENTER";
  }, 5000);
</script>
</body>
</html>
